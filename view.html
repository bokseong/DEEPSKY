<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글 보기 - DEEP SKY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", sans-serif; background: #0b0f2b; color: white; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; }
        .container { max-width: 850px; margin: 40px auto; padding: 0 20px 100px; }
        
        .view-card { background: #161b4a; padding: 35px; border-radius: 15px; border: 1px solid #2d367a; margin-bottom: 30px; }
        .post-title { font-size: 26px; color: #7fc7ff; margin-bottom: 10px; }
        .post-info { color: #888; font-size: 14px; margin-bottom: 25px; border-bottom: 1px solid #2d367a; padding-bottom: 15px; }
        
        .file-box { background: rgba(58, 90, 255, 0.1); padding: 15px; border-radius: 10px; border: 1px solid #3a5aff; margin-bottom: 25px; }
        .post-content { line-height: 1.8; white-space: pre-wrap; font-size: 16px; min-height: 200px; }
        
        .comment-section { background: #070a1d; padding: 20px; border-radius: 15px; border: 1px solid #1b2f80; }
        .comment-item { padding: 12px 0; border-bottom: 1px solid #1b2f80; }
        .c-author { font-weight: bold; color: #7fc7ff; font-size: 14px; }
        .c-text { margin-top: 5px; font-size: 15px; }
        
        textarea { width: 100%; height: 70px; background: #161b4a; border: 1px solid #2d367a; color: white; padding: 10px; border-radius: 8px; margin-top: 15px; resize: none; }
        .btn-comment { width: 100%; padding: 10px; background: #3a5aff; color: white; border: none; border-radius: 8px; margin-top: 8px; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;">DEEP SKY</a>
</div>

<div class="container">
    <div class="view-card">
        <h2 id="vTitle" class="post-title"></h2>
        <div id="vInfo" class="post-info"></div>

        <div id="fileBox" class="file-box hidden">
            <span style="font-size:14px; color:#7fc7ff;">📎 첨부파일: </span>
            <a id="vFile" href="#" target="_blank" style="color:white; font-weight:bold; text-decoration:underline;"></a>
        </div>

        <div id="vContent" class="post-content"></div>

        <div style="text-align:right; margin-top:30px; gap:10px; display:flex; justify-content:flex-end;">
            <button id="delBtn" class="hidden" onclick="deletePost()" style="background:#ff4d4d; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">삭제</button>
            <button onclick="location.href='board.html'" style="background:#444; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">목록으로</button>
        </div>
    </div>

    <div class="comment-section">
        <h4 style="margin:0;">댓글</h4>
        <div id="cList"></div>
        <div id="cForm" class="hidden">
            <textarea id="cInput" placeholder="댓글을 입력하세요..."></textarea>
            <button class="btn-comment" onclick="addComment()">댓글 등록</button>
        </div>
        <p id="cMsg" style="text-align:center; color:#888; font-size:14px; margin-top:15px;">댓글을 쓰려면 로그인이 필요합니다.</p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = { /* 위와 동일 */ };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

const postId = new URLSearchParams(window.location.search).get('id');
let uName = "";

auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById("cForm").classList.remove("hidden");
        document.getElementById("cMsg").classList.add("hidden");
        db.ref('users/'+user.uid+'/name').once('value', s => uName = s.val() || user.email.split('@')[0]);
    }
    loadPost(user);
    loadComments();
});

function loadPost(user) {
    db.ref("freeboard/" + postId).on("value", s => {
        const p = s.val();
        if(!p) return;
        document.getElementById("vTitle").innerText = p.title;
        document.getElementById("vInfo").innerText = `작성자: ${p.author} | ${new Date(p.createdAt).toLocaleString()}`;
        document.getElementById("vContent").innerText = p.content;

        if(p.fileUrl) {
            document.getElementById("fileBox").classList.remove("hidden");
            const link = document.getElementById("vFile");
            link.href = p.fileUrl;
            link.innerText = p.fileName || "첨부파일 다운로드";
        }

        if(user && (user.uid === p.uid || user.email === "leader.deepsky@gmail.com")) {
            document.getElementById("delBtn").classList.remove("hidden");
        }
    });
}

function addComment() {
    const text = document.getElementById("cInput").value.trim();
    if(!text) return;
    db.ref(`freeboard/${postId}/comments`).push({
        author: uName, content: text, createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => document.getElementById("cInput").value = "");
}

function loadComments() {
    db.ref(`freeboard/${postId}/comments`).on("value", s => {
        const list = document.getElementById("cList");
        list.innerHTML = "";
        const data = s.val();
        if(!data) return;
        Object.keys(data).forEach(k => {
            const c = data[k];
            list.innerHTML += `<div class="comment-item"><div class="c-author">${c.author}</div><div class="c-text">${c.content}</div></div>`;
        });
    });
}

function deletePost() {
    if(confirm("정말 삭제하시겠습니까?")) {
        db.ref("freeboard/" + postId).remove().then(() => location.href="board.html");
    }
}
</script>
</body>
</html>
