<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 보기 - DEEP SKY</title>
    <style>
        /* 동일 스타일 가이드라인 */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", sans-serif; background: #0b0f2b; color: white; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 60px; position: sticky; top: 0; }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }
        nav { background: #11153a; border-bottom: 1px solid #2d367a; padding: 10px 0; }
        .nav-inner { max-width: 1000px; margin: 0 auto; display: flex; justify-content: center; gap: 5px; }
        nav a { color: white; padding: 12px 18px; text-decoration: none; font-weight: bold; border-radius: 8px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px 100px; }
        .intro-card { background: #161b4a; padding: 40px; border-radius: 20px; border: 1px solid #2d367a; }
        
        .v-title { font-size: 24px; color: #7fc7ff; border-left: 5px solid #3a5aff; padding-left: 15px; margin-bottom: 5px; }
        .v-info { font-size: 13px; color: #888; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .link-btn { display: inline-block; background: #3a5aff; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 20px; }
        .v-content { font-size: 16px; white-space: pre-wrap; line-height: 1.8; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="top-bar">
    <a href="index.html" class="logo-area"><img src="logo.png"><span>DEEP SKY</span></a>
</div>
<header><h1>글 보기</h1></header>
<nav><div class="nav-inner"><a href="board.html">목록으로</a></div></nav>
<div class="container">
    <div class="intro-card">
        <div id="vTitle" class="v-title">불러오는 중...</div>
        <div id="vInfo" class="v-info"></div>
        <a id="vLink" href="#" target="_blank" class="link-btn hidden">파일/링크 열기</a>
        <div id="vContent" class="v-content"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"    
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const postId = new URLSearchParams(window.location.search).get('id');

    db.ref("freeboard/" + postId).on("value", s => {
        const p = s.val();
        if(!p) return;
        document.getElementById("vTitle").innerText = p.title;
        document.getElementById("vInfo").innerText = `작성자: ${p.author} | ${new Date(p.createdAt).toLocaleDateString()}`;
        document.getElementById("vContent").innerText = p.content;
        if(p.fileUrl) {
            const l = document.getElementById("vLink");
            l.href = p.fileUrl;
            l.innerText = p.fileName || "링크 열기";
            l.classList.remove("hidden");
        }
    });
</script>
</body>
</html>
