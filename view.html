<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 보기 - DEEP SKY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", sans-serif; background: #0b0f2b; color: white; }
        .hidden { display: none !important; }
        
        /* 상단 바 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; font-weight: bold; }
        .logo-area img { width: 40px; border-radius: 50%; margin-right: 12px; }

        /* 상단 사용자 상태 및 버튼 */
        .user-menu { display: flex; align-items: center; gap: 15px; font-size: 14px; }
        .btn-auth { background: #3a5aff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; text-decoration: none; }
        .btn-logout { background: #444; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px 100px; }
        .view-card { background: #161b4a; padding: 40px; border-radius: 15px; border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .post-header { border-bottom: 1px solid #2d367a; margin-bottom: 25px; padding-bottom: 20px; }
        .post-title { font-size: 28px; color: #7fc7ff; margin: 0 0 15px 0; }
        .post-info { font-size: 14px; color: #aaa; display: flex; justify-content: space-between; }
        .post-content { line-height: 1.8; min-height: 200px; white-space: pre-wrap; font-size: 17px; color: #eee; margin-bottom: 30px; }
        
        .link-section { background: rgba(58, 90, 255, 0.1); padding: 15px; border-radius: 10px; border: 1px dashed #3a5aff; margin-bottom: 30px; }
        .btn-link { display: inline-block; background: #3a5aff; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s; }

        /* 💬 댓글 섹션 */
        .comment-section { margin-top: 40px; border-top: 1px solid #2d367a; padding-top: 30px; }
        .comment-form { margin-top: 20px; display: flex; gap: 10px; }
        .comment-input { flex: 1; background: #070a1d; border: 1px solid #2d367a; border-radius: 6px; color: white; padding: 10px; outline: none; }
        .btn-comment { background: #3a5aff; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .comment-list { margin-top: 25px; }
        .comment-item { padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .comment-meta { font-size: 13px; color: #7fc7ff; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .comment-text { font-size: 15px; color: #ddd; line-height: 1.5; white-space: pre-wrap; }
        .btn-comment-del { color: #ff4d4d; cursor: pointer; font-size: 12px; background: none; border: none; }

        .btn-group { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2d367a; padding-top: 30px; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-list { background: #2d367a; color: white; }
        .btn-delete { background: #ff4d4d; color: white; }

        footer { background: #070a1d; text-align: center; padding: 35px 20px; color: #888; border-top: 1px solid #1b2f80; font-size: 13px; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/40'">
        <span>DEEP SKY</span>
    </a>
    <div id="userStatus" class="user-menu">
        </div>
</div>

<div class="container">
    <div id="postArea" class="view-card hidden">
        <div class="post-header">
            <h2 id="viewTitle" class="post-title"></h2>
            <div class="post-info">
                <span id="viewAuthor"></span>
                <span id="viewDate"></span>
            </div>
        </div>
        
        <div id="viewContent" class="post-content"></div>

        <div id="linkArea" class="link-section hidden">
            <div style="font-size: 13px; color: #7fc7ff; margin-bottom: 8px; font-weight: bold;">첨부된 링크</div>
            <a id="viewFileLink" href="#" target="_blank" class="btn-link">파일/링크 열기</a>
        </div>

        <div class="comment-section">
            <h4 style="margin: 0; color: #7fc7ff;">댓글</h4>
            <div id="commentList" class="comment-list"></div>
            
            <div id="commentWriteArea" class="comment-form hidden">
                <input type="text" id="commentInput" class="comment-input" placeholder="댓글을 입력하세요...">
                <button class="btn-comment" onclick="addComment()">등록</button>
            </div>
            <div id="loginNotice" style="font-size: 13px; color: #888; margin-top: 20px; text-align: center;">
                댓글은 로그인 후 작성할 수 있습니다.
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-list" onclick="location.href='board.html'">목록으로 돌아가기</button>
            <button id="deleteBtn" class="btn btn-delete hidden" onclick="deletePost()">이 글 삭제하기</button>
        </div>
    </div>
</div>

<footer>© DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

const urlParams = new URLSearchParams(window.location.search);
const postId = urlParams.get('id');

let currentUser = null;
let currentUserName = "익명";

// 1. 사용자 상태 감지 (원본 로직 반영)
auth.onAuthStateChanged(user => {
    const statusDiv = document.getElementById("userStatus");
    const writeArea = document.getElementById("commentWriteArea");
    const loginNotice = document.getElementById("loginNotice");

    currentUser = user;
    if (user) {
        db.ref('users/' + user.uid + '/name').once('value', (snapshot) => {
            currentUserName = snapshot.val() || user.email.split('@')[0];
            statusDiv.innerHTML = `
                <span>${currentUserName}님</span>
                <button class="btn-auth btn-logout" onclick="auth.signOut()">로그아웃</button>
            `;
        });
        writeArea.classList.remove("hidden");
        loginNotice.classList.add("hidden");
    } else {
        statusDiv.innerHTML = `<a href="login.html" class="btn-auth">로그인</a>`;
        writeArea.classList.add("hidden");
        loginNotice.classList.remove("hidden");
    }
    loadPost(user);
    loadComments(user);
});

// 2. 게시글 로드
function loadPost(user) {
    if(!postId) { location.href = "board.html"; return; }

    db.ref("freeboard/" + postId).once("value").then(snapshot => {
        const post = snapshot.val();
        const postArea = document.getElementById("postArea");

        if(!post) {
            postArea.innerHTML = "<div style='text-align:center; padding:100px;'><h3>삭제된 게시글입니다.</h3></div>";
            postArea.classList.remove("hidden");
            return;
        }

        postArea.classList.remove("hidden");
        document.getElementById("viewTitle").innerText = post.title;
        document.getElementById("viewAuthor").innerText = "작성자: " + (post.author || "익명");
        document.getElementById("viewDate").innerText = post.createdAt ? new Date(post.createdAt).toLocaleString() : "";
        document.getElementById("viewContent").innerText = post.content;

        if(post.fileUrl) {
            const linkArea = document.getElementById("linkArea");
            const linkBtn = document.getElementById("viewFileLink");
            linkArea.classList.remove("hidden");
            linkBtn.href = post.fileUrl.startsWith('http') ? post.fileUrl : 'https://' + post.fileUrl;
            linkBtn.innerText = "🔗 " + (post.fileName || "첨부 링크 열기");
        }

        if(user && (user.uid === post.uid || user.email === ADMIN_EMAIL)) {
            document.getElementById("deleteBtn").classList.remove("hidden");
        }
    });
}

// 3. 댓글 로드 (freeboard/postId/comments 경로)
function loadComments(user) {
    db.ref(`freeboard/${postId}/comments`).on("value", snapshot => {
        const listDiv = document.getElementById("commentList");
        listDiv.innerHTML = "";
        
        db.ref(`freeboard/${postId}/uid`).once("value", postAuthorSnap => {
            const postAuthorUid = postAuthorSnap.val();

            snapshot.forEach(child => {
                const comment = child.val();
                const cid = child.key;
                let delBtn = "";

                if(user && (user.uid === comment.uid || user.uid === postAuthorUid || user.email === ADMIN_EMAIL)) {
                    delBtn = `<button class="btn-comment-del" onclick="deleteComment('${cid}')">삭제</button>`;
                }

                const item = document.createElement("div");
                item.className = "comment-item";
                item.innerHTML = `
                    <div class="comment-meta">
                        <span><strong>${comment.author}</strong> <small style="color:#666; margin-left:8px;">${new Date(comment.createdAt).toLocaleString()}</small></span>
                        ${delBtn}
                    </div>
                    <div class="comment-text">${comment.content}</div>
                `;
                listDiv.appendChild(item);
            });
        });
    });
}

// 4. 댓글 작성/삭제
function addComment() {
    const input = document.getElementById("commentInput");
    if(!input.value.trim()) return;

    db.ref(`freeboard/${postId}/comments`).push({
        uid: currentUser.uid,
        author: currentUserName,
        content: input.value.trim(),
        createdAt: Date.now()
    }).then(() => input.value = "");
}

function deleteComment(cid) {
    if(confirm("댓글을 삭제하시겠습니까?")) {
        db.ref(`freeboard/${postId}/comments/${cid}`).remove();
    }
}

// 5. 게시글 삭제
function deletePost() {
    if(confirm("정말로 삭제하시겠습니까?")) {
        db.ref("freeboard/" + postId).remove().then(() => {
            alert("삭제되었습니다.");
            location.href = 'board.html';
        });
    }
}
</script>
</body>
</html>
