<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>DEEP SKY</title>
    <style>
        /* [수정] 바닥 고정을 위한 레이아웃 설정 */
        html, body { height: 100%; margin: 0; }
        body { 
            display: flex; 
            flex-direction: column; 
            font-family: "Pretendard", sans-serif; 
            background: #0b0f2b; 
            color: white; 
        }

        * { box-sizing: border-box; }
        .hidden { display: none !important; }
        
        /* 상단 바 */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; 
            height: 65px; flex-shrink: 0; /* 상단바 고정 크기 유지 */
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; font-weight: bold; }
        .logo-area img { width: 40px; border-radius: 50%; margin-right: 12px; }

        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button {
            padding: 7px 16px; border-radius: 5px; border: none;
            background: #5a7aff; color: white; 
            cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }
        .btn-logout { background: #5a7aff !important; }

        /* [수정] 컨테이너가 남는 공간을 다 차지하도록 설정 */
        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px 60px; /* 아래쪽 패딩 조정 */
            flex: 1; /* 이 부분이 푸터를 바닥으로 밀어냅니다 */
            width: 100%;
        }

        .view-card { background: #161b4a; padding: 40px; border-radius: 15px; border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .post-header { border-bottom: 1px solid #2d367a; margin-bottom: 25px; padding-bottom: 20px; }
        .post-title { font-size: 28px; color: #7fc7ff; margin: 0 0 15px 0; }
        .post-info { font-size: 14px; color: #aaa; display: flex; justify-content: space-between; }
        .post-content { line-height: 1.8; min-height: 200px; white-space: pre-wrap; font-size: 17px; color: #eee; margin-bottom: 30px; }
        
        .link-section { background: rgba(58, 90, 255, 0.1); padding: 15px; border-radius: 10px; border: 1px dashed #3a5aff; margin-bottom: 30px; }
        .btn-link { display: inline-block; background: #3a5aff; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn-link:hover { background: #5a7aff; transform: translateY(-2px); }

        .comment-section { margin-top: 40px; border-top: 1px solid #2d367a; padding-top: 30px; }
        .comment-title { font-size: 18px; color: #7fc7ff; margin-bottom: 20px; font-weight: bold; }
        .comment-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid rgba(45, 54, 122, 0.5);word-wrap: break-word; overflow-wrap: break-word; }
        .comment-meta { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 8px; }
        .comment-author { color: #7fc7ff; font-weight: bold; }
        .comment-text { font-size: 15px; line-height: 1.5;  color: #ddd;  white-space: pre-wrap; word-break: break-all; }
        .btn-comment-del { color: #ff4d4d; cursor: pointer; background: none; border: none; font-size: 12px; padding: 0; }
        
        .comment-form { margin-top: 25px; display: flex; gap: 10px; }
        .comment-input { flex: 1; background: #070a1d; border: 1px solid #2d367a; border-radius: 6px; color: white; padding: 12px; font-size: 14px; outline: none; }
        .btn-comment-submit { background: #3a5aff; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .btn-group { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2d367a; padding-top: 30px; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-list { background: #2d367a; color: white; }
        .btn-list:hover { background: #3d4a8a; }
        .btn-delete { background: #ff4d4d; color: white; }
        .btn-delete:hover { background: #e60000; }

        /* [수정] 푸터 스타일 */
        footer { 
            background: #070a1d; text-align: center; padding: 35px 20px;
            color: #888; border-top: 1px solid #1b2f80; font-size: 13px;
            flex-shrink: 0; /* 푸터 높이 유지 */
        }

        @media (max-width: 600px) {
            .logo-area span { font-size: 16px; }
            nav a { padding: 10px 12px; font-size: 13px; }
            header h1 { font-size: 22px; }
            .header-logo { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/40'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">접속 중...</span>
        <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="btn-logout hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<div class="container">
    <div id="postArea" class="view-card hidden">
        <div class="post-header">
            <h2 id="viewTitle" class="post-title"></h2>
            <div class="post-info">
                <span id="viewAuthor"></span>
                <span id="viewDate"></span>
            </div>
        </div>
        
        <div id="viewContent" class="post-content"></div>

        <div id="linkArea" class="link-section hidden">
            <div style="font-size: 13px; color: #7fc7ff; margin-bottom: 8px; font-weight: bold;">첨부된 링크</div>
            <a id="viewFileLink" href="#" target="_blank" class="btn-link">파일/링크 열기</a>
        </div>
            <div id="vFileContainer" class="hidden" style="margin-top:15px; padding:12px; background:rgba(255,255,255,0.05); border-radius:8px; border-left:3px solid #3a5aff;">
            <span style="font-size:14px; color:#7fc7ff; font-weight:bold;">첨부 파일 다운로드: </span>
            <a id="vFileDownloadBtn" href="#" target="_blank" style="color:#fff; font-weight:bold; text-decoration:underline; margin-left:10px;"></a>
        </div>

        <div class="comment-section">
            <div class="comment-title">댓글</div>
            <div id="commentList"></div>
            
            <div id="commentFormArea" class="comment-form hidden">
                <input type="text" id="commentInput" class="comment-input" placeholder="댓글을 남겨보세요...">
                <button class="btn-comment-submit" onclick="addComment()">등록</button>
            </div>
            <div id="commentLoginNotice" style="text-align: center; padding: 20px; color: #aaa; font-size: 14px;">
                댓글을 작성하려면 로그인이 필요합니다.
            </div>
        </div>
        
        <div class="btn-group" style="display: flex; justify-content: space-between; align-items: center;">
            <button class="btn btn-list" onclick="location.href='board.html'">목록으로 돌아가기</button>
            <div style="display: flex; gap: 10px;">
                <button id="editBtn" class="btn hidden" style="background: #3a5aff; color: white;">수정하기</button>
                <button id="deleteBtn" class="btn btn-delete hidden" onclick="deletePost()">이 글 삭제하기</button>
            </div>
        </div>
    </div> </div>

<footer>
    © DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.
    <br>
    Email : leader.deepsky@gmail.com &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;Designed by jw-astro09
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>

<script>
// 1. Firebase 설정
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const appCheck = firebase.appCheck();
appCheck.activate('6Leol8MsAAAAAJcS-pWEjPLZu4alKMIxiYYiDJI0', true);

const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

const GAS_URL = "https://script.google.com/macros/s/AKfycbzYfQsVrnGOHpFECSp4s3JLZPtA30S6UIkHgWdr0lDTcMHlNeCOUxlKAuBnR_Z69Sw0aA/exec";

const urlParams = new URLSearchParams(window.location.search);
const postId = urlParams.get('id');

let currentUserName = "";
let currentUserRole = "";
let currentPostAuthorUid = ""; 
let currentPostTitle = "";

function getRoleName(role) {
    switch(role) {
        case 'admin': return '관리자';
        case 'student': return '동아리 부원';
        default: return '일반 회원';
    }
}

auth.onAuthStateChanged(async (user) => {
    const status = document.getElementById("userStatus");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const commentFormArea = document.getElementById("commentFormArea");
    const commentLoginNotice = document.getElementById("commentLoginNotice");

    if (user) {
        db.ref('users/' + user.uid).on('value', (snapshot) => {
            const userData = snapshot.val() || {};
            currentUserName = userData.name || user.displayName || user.email.split('@')[0];
            currentUserRole = (user.email === ADMIN_EMAIL) ? 'admin' : (userData.role || 'member');
            status.innerText = `${currentUserName}님 (${getRoleName(currentUserRole)})`;

            // [수정] 로그인한 유저라면 등급에 상관없이 댓글 작성 폼을 보여줌
            commentFormArea.classList.remove("hidden");
            commentLoginNotice.classList.add("hidden");
        });
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
    } else {
        currentUserName = "익명";
        currentUserRole = "guest";
        status.innerText = "로그인 해주세요";
        loginBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        
        // [수정] 비로그인 시에만 댓글 폼을 숨기고 안내 메시지 표시
        commentFormArea.classList.add("hidden");
        commentLoginNotice.classList.remove("hidden");
        commentLoginNotice.innerText = "댓글을 작성하려면 로그인이 필요합니다.";
    }

    if (postId) {
        loadPost(user);
        loadComments(user);
    } else {
        alert("게시글 ID가 없습니다.");
        location.href = "board.html";
    }
});

function loadPost(user) {
    db.ref("freeboard/" + postId).once("value").then(async (snapshot) => {
        const postData = snapshot.val();
        const postArea = document.getElementById("postArea");
        if (!postData) {
            postArea.innerHTML = "<div style='text-align:center; padding:100px;'><h3>삭제된 게시글입니다.</h3></div>";
            postArea.classList.remove("hidden");
            return;
        }

        currentPostAuthorUid = postData.uid; 
        currentPostTitle = postData.title; 

        postArea.classList.remove("hidden");
        document.getElementById("viewTitle").innerText = postData.title;
        document.getElementById("viewContent").innerText = postData.content;
        document.getElementById("viewDate").innerText = new Date(postData.createdAt || Date.now()).toLocaleString();

        let authorDisplayName = postData.author || "익명";
        if (postData.uid) {
            const userSnap = await db.ref('users/' + postData.uid).once('value');
            if (userSnap.exists()) authorDisplayName = userSnap.val().name || authorDisplayName;
        }
        document.getElementById("viewAuthor").innerText = "작성자: " + authorDisplayName;

        renderLinks(postData);

        const deleteBtn = document.getElementById("deleteBtn");
        const editBtn = document.getElementById("editBtn");
        if (user && (user.uid === postData.uid || user.email === ADMIN_EMAIL)) {
            deleteBtn.classList.remove("hidden");
            if (user.uid === postData.uid) {
                editBtn.classList.remove("hidden");
                editBtn.onclick = () => { location.href = `write.html?id=${postId}`; };
            }
        }
    });
}

function renderLinks(post) {
    const linkArea = document.getElementById("linkArea");
    const viewFileLink = document.getElementById("viewFileLink");
    const oldLinks = linkArea.querySelectorAll(".dynamic-link");
    oldLinks.forEach(l => l.remove());

    if (post.links && post.links.length > 0) {
        linkArea.classList.remove("hidden");
        viewFileLink.classList.add("hidden"); 
        post.links.forEach(link => {
            const newBtn = document.createElement("a");
            newBtn.href = link.url;
            newBtn.target = "_blank";
            newBtn.className = "btn-link dynamic-link";
            newBtn.style.display = "block";
            newBtn.style.marginBottom = "8px";
            newBtn.innerText = "🔗 " + link.name;
            linkArea.appendChild(newBtn);
        });
    } else if (post.fileUrl && post.fileUrl.trim() !== "") {
        linkArea.classList.remove("hidden");
        viewFileLink.classList.remove("hidden");
        let url = post.fileUrl.trim();
        if (!url.startsWith('http')) url = 'https://' + url;
        viewFileLink.href = url;
        viewFileLink.innerText = "🔗 " + (post.fileName || "첨부 링크 열기");
    } else {
        linkArea.classList.add("hidden");
    }
}

function loadComments(user) {
    db.ref("freeboard/" + postId + "/comments").on("value", (snapshot) => {
        const listArea = document.getElementById("commentList");
        listArea.innerHTML = "";
        if (!snapshot.exists()) {
            listArea.innerHTML = "<div style='color:#666; font-size:14px; text-align:center; padding:10px;'>등록된 댓글이 없습니다.</div>";
            return;
        }
        snapshot.forEach((child) => {
            const comment = child.val();
            const commentId = child.key;
            const canDelete = user && (user.uid === comment.uid || user.uid === currentPostAuthorUid || user.email === ADMIN_EMAIL);
            const html = `
                <div class="comment-item">
                    <div class="comment-meta">
                        <span class="comment-author">${escapeHtml(comment.author)}</span>
                        <span>${new Date(comment.createdAt).toLocaleString()}
                        ${canDelete ? `<button class="btn-comment-del" onclick="deleteComment('${commentId}')" style="margin-left:10px;">삭제</button>` : ""}</span>
                    </div>
                    <div class="comment-text">${escapeHtml(comment.content)}</div>
                </div>`;
            listArea.innerHTML += html;
        });
    });
}

function addComment() {
    const user = auth.currentUser;
    const input = document.getElementById("commentInput");
    
    if (!user) return alert("로그인이 필요합니다.");
    // [수정] guest가 아니면 (즉, 로그인한 회원이면) 누구나 작성 가능하도록 조건 변경
    if (currentUserRole === 'guest') return alert("댓글 작성 권한이 없습니다.");
    if (!input.value.trim()) return alert("내용을 입력하세요.");

    const commentMsg = input.value.trim();

    db.ref("freeboard/" + postId + "/comments").push({
        uid: user.uid,
        author: currentUserName,
        content: commentMsg,
        createdAt: Date.now()
    }).then(() => {
        if (currentPostAuthorUid && currentPostAuthorUid !== user.uid) {
            sendNotificationEmail(commentMsg);
        }
        input.value = "";
    }).catch(err => alert("댓글 등록 실패: " + err.message));
}

async function sendNotificationEmail(msg) {
    try {
        const snap = await db.ref("users/" + currentPostAuthorUid).once("value");
        const authorData = snap.val();
        if (!authorData || !authorData.email) return;

        const formData = new URLSearchParams();
        formData.append("email", authorData.email);
        formData.append("name", authorData.name || "회원");
        formData.append("postTitle", currentPostTitle);
        formData.append("commentAuthor", currentUserName);
        formData.append("commentContent", msg);
        formData.append("postUrl", window.location.href);

        fetch(GAS_URL, {
            method: "POST",
            body: formData,
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        })
        .then(res => res.text())
        .then(result => console.log("알림 발송 상태:", result))
        .catch(err => console.error("GAS 발송 오류:", err));

    } catch (e) {
        console.error("알림 프로세스 중 오류:", e);
    }
}

function deleteComment(id) { if(confirm("댓글을 삭제하시겠습니까?")) db.ref("freeboard/"+postId+"/comments/"+id).remove(); }
function deletePost() { if(confirm("게시글을 삭제하시겠습니까?")) db.ref("freeboard/"+postId).remove().then(() => location.href='board.html'); }
function logout() { if(confirm("로그아웃 하시겠습니까?")) auth.signOut().then(() => location.reload()); }
function escapeHtml(t) { const d = document.createElement('div'); d.innerText = t; return d.innerHTML; }
</script>
</body>
</html>
