<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 보기 - DEEP SKY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", sans-serif; background: #0b0f2b; color: white; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; }
        .container { max-width: 850px; margin: 40px auto; padding: 0 20px 100px; }
        
        .view-card { background: #161b4a; padding: 35px; border-radius: 15px; border: 1px solid #2d367a; margin-bottom: 30px; }
        .post-title { font-size: 26px; color: #7fc7ff; margin-bottom: 15px; }
        .post-content { line-height: 1.8; white-space: pre-wrap; margin-bottom: 30px; font-size: 16px; color: #ddd; }
        
        .comment-section { background: #0b0f2b; padding: 25px; border-radius: 15px; border: 1px solid #1b2f80; }
        .comment-item { border-bottom: 1px solid #1b2f80; padding: 15px 0; }
        .comment-author { font-weight: bold; color: #7fc7ff; font-size: 14px; }
        .comment-text { margin-top: 5px; color: #eee; }
        
        textarea#commentInput { width: 100%; height: 80px; background: #161b4a; border: 1px solid #2d367a; color: white; padding: 12px; border-radius: 8px; margin-top: 20px; resize: none; }
        .btn-comment { width: 100%; padding: 12px; background: #3a5aff; color: white; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" style="text-decoration:none; color:white; font-weight:bold;">DEEP SKY</a>
</div>

<div class="container">
    <div class="view-card">
        <h2 id="vTitle" class="post-title">불러오는 중...</h2>
        <div id="vContent" class="post-content"></div>
        <div style="text-align:right; gap:10px; display:flex; justify-content:flex-end;">
            <button id="delBtn" class="hidden" onclick="deletePost()" style="background:#ff4d4d; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">삭제</button>
            <button onclick="location.href='board.html'" style="background:#444; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">목록으로</button>
        </div>
    </div>

    <div class="comment-section">
        <h3 style="margin:0; font-size:18px;">댓글</h3>
        <div id="cList"></div>
        
        <div id="cForm" class="hidden">
            <textarea id="commentInput" placeholder="댓글을 입력하세요..."></textarea>
            <button class="btn-comment" onclick="addComment()">댓글 등록</button>
        </div>
        <p id="cMsg" style="text-align:center; color:#888; margin-top:20px;">댓글을 쓰려면 <a href="login.html" style="color:#7fc7ff;">로그인</a>이 필요합니다.</p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = { /* 위와 동일 */ };
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

const urlParams = new URLSearchParams(window.location.search);
const postId = urlParams.get('id');
let uName = "";

auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById("cForm").classList.remove("hidden");
        document.getElementById("cMsg").classList.add("hidden");
        db.ref('users/'+user.uid+'/name').once('value', s => uName = s.val() || user.email.split('@')[0]);
    }
    loadPost(user);
    loadComments();
});

function loadPost(user) {
    db.ref("freeboard/" + postId).on("value", s => {
        const p = s.val();
        if(!p) return;
        document.getElementById("vTitle").innerText = p.title;
        document.getElementById("vContent").innerText = p.content;
        if(user && (user.uid === p.uid || user.email === "leader.deepsky@gmail.com")) {
            document.getElementById("delBtn").classList.remove("hidden");
        }
    });
}

function addComment() {
    const text = document.getElementById("commentInput").value.trim();
    if(!text) return;
    db.ref(`freeboard/${postId}/comments`).push({
        author: uName,
        content: text,
        uid: auth.currentUser.uid,
        createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => document.getElementById("commentInput").value = "");
}

function loadComments() {
    db.ref(`freeboard/${postId}/comments`).on("value", s => {
        const list = document.getElementById("cList");
        list.innerHTML = "";
        const data = s.val();
        if(!data) return;
        Object.keys(data).forEach(k => {
            const c = data[k];
            list.innerHTML += `<div class="comment-item"><div class="comment-author">${c.author}</div><div class="comment-text">${c.content}</div></div>`;
        });
    });
}

function deletePost() {
    if(confirm("삭제하시겠습니까?")) {
        db.ref("freeboard/" + postId).remove().then(() => location.href="board.html");
    }
}
</script>
</body>
</html>
