        <img src="logo.png" alt="DEEP SKY 로고" class="nav-logo">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-user-zone">
        <span id="userNameDisplay" class="hidden" style="font-size:.9rem; color:#ccc;"></span>
        <a href="login.html" id="loginBtn" class="auth-btn">로그인</a>
        <button id="logoutBtn" class="auth-btn hidden" type="button">로그아웃</button>
    </div>
</div>

<nav class="sub-nav-container" aria-label="주요 메뉴">
    <div class="nav-menu">

      </div>

<main class="container">
    <article class="view-card">
        <div class="admin-zone">
            <button class="btn-small hidden" id="btnBookmarkPost" type="button">저장</button>
            <button class="btn-small hidden" id="btnReportPost" type="button">신고</button>
            <button class="btn-small hidden" id="btnEditPost" type="button">수정</button>
            <button class="btn-small hidden" id="btnDeletePost" type="button" style="color:#ff4d4d; border-color:#ff4d4d;">삭제</button>
        </div>
        <div class="post-header">
            <div id="viewCategory" class="post-category">자료실</div>
            <h1 id="viewTitle" class="post-title">불러오는 중...</h1>
            <div class="post-info"><span id="viewAuthor">-</span><span id="viewDate">-</span></div>
        </div>
        <div id="viewContent" class="post-content"></div>
        <div class="links-container" id="linksContainer"></div>
        <div class="comment-section">
            <div class="comment-title">댓글</div>
            <div id="commentList"></div>
            <div id="commentFormArea" class="hidden">
                <div class="comment-form">
                    <input type="text" id="commentInput" class="comment-input" aria-label="댓글" placeholder="의견을 남겨주세요">
                    <button class="btn-comment" id="btnPostComment" type="button">등록</button>
                </div>
            </div>
            <div id="loginNotice" class="hidden" style="text-align:center; color:#888; margin-top:20px;">댓글 작성을 위해 <a href="login.html" style="color:var(--accent)">로그인</a>이 필요합니다.</div>
        </div>
        <a href="resource.html" style="display:block; margin-top:40px; color:#888; text-decoration:none;">← 자료 목록으로</a>
    </article>
</main>
