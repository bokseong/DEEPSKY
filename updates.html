<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <title>DEEP SKY | 업데이트 기록</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/records.css">
</head>
<body>
<div class="auth-bar">
    <a href="index.html" class="logo-link"><img src="logo.png" alt="DEEP SKY logo" class="nav-logo"><span>DEEP SKY</span></a>
    <div class="auth-user-zone">
        <a href="login.html" id="login-link" class="auth-btn">LOGIN</a>
        <span id="user-name" hidden></span>
        <button id="logout-btn" class="auth-btn" hidden>LOGOUT</button>
    </div>
</div>
<header class="records-hero updates-hero">
    <h1>업데이트 기록</h1>
    <p>홈페이지와 서버 기능 변경 내역</p>
</header>
<nav class="sub-nav-container" aria-label="주요 메뉴">
    <div class="nav-menu">
        <a href="index.html">HOME</a><a href="introduction.html">INTRODUCTION</a><a href="talk.html">TALK</a><a href="resource.html">RESOURCE</a><a href="suggest.html">SUGGESTION</a><a href="mypage.html">MY PAGE</a><a href="admin.html">ADMIN</a>
    </div>
</nav>
<main class="records-main">
    <section class="records-panel" aria-labelledby="updates-title">
        <div class="records-heading">
            <div><p class="records-eyebrow">CHANGELOG</p><h2 id="updates-title">업데이트 게시판</h2></div>
            <button type="button" id="update-compose-toggle" class="btn" hidden>기록 작성</button>
        </div>
        <form id="update-form" class="compact-form update-form" hidden>
            <h3 id="update-form-title">새 업데이트 기록</h3>
            <input type="hidden" id="update-id">
            <div class="update-form-grid">
                <label>버전<input id="update-version" maxlength="40" placeholder="예: v2.1.0"></label>
                <label>게시일<input id="update-published-at" type="datetime-local"></label>
            </div>
            <label>제목<input id="update-title" maxlength="120" required></label>
            <label>내용<textarea id="update-content" maxlength="8000" rows="9" required></textarea></label>
            <label class="update-pinned"><input id="update-pinned" type="checkbox"> 상단 고정</label>
            <p id="update-form-status" class="form-status" role="status"></p>
            <div class="actions"><button type="button" id="update-cancel" class="btn">취소</button><button type="submit" class="btn btn-primary">저장</button></div>
        </form>
        <div id="update-list" class="update-list"><div class="loading-state">업데이트 기록을 불러오는 중입니다.</div></div>
    </section>
</main>
<footer><p>&copy; 2026 DEEP SKY. All Rights Reserved.</p><p>복성고등학교 천문·항공우주 동아리</p><p>Contact: leader.deepsky@gmail.com</p></footer>
<script type="module" src="js/updates.js"></script>
<script type="module" src="frontend-access-control.js"></script>
</body>
</html>
