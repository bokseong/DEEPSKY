<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자유 게시판 - DEEP SKY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", sans-serif; background: #0b0f2b; color: white; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-write { padding: 10px 20px; background: #3a5aff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; }
        
        .post-list { background: #161b4a; border-radius: 15px; border: 1px solid #2d367a; overflow: hidden; }
        .post-item { display: grid; grid-template-columns: 1fr 150px; padding: 18px 25px; border-bottom: 1px solid #2d367a; cursor: pointer; transition: 0.2s; }
        .post-item:hover { background: rgba(58, 90, 255, 0.1); }
        .post-title { font-weight: bold; color: #7fc7ff; }
        .post-author { text-align: right; color: #aaa; font-size: 14px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;">DEEP SKY</a>
    <div id="userStatus" style="font-size:14px;"></div>
</div>

<div class="container">
    <div class="board-header">
        <h2 style="color:#7fc7ff; margin:0;">자유 게시판</h2>
        <a href="write.html" class="btn-write">글쓰기</a>
    </div>

    <div class="post-list" id="postList">
        <p style="text-align:center; padding:50px; color:#888;">게시글을 불러오는 중...</p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

firebase.auth().onAuthStateChanged(user => {
    if(user) document.getElementById("userStatus").innerText = user.email.split('@')[0] + "님";
    loadPosts();
});

function loadPosts() {
    db.ref("freeboard").on("value", snapshot => {
        const list = document.getElementById("postList");
        list.innerHTML = "";
        const data = snapshot.val();
        if(!data) {
            list.innerHTML = "<p style='text-align:center; padding:50px; color:#888;'>글이 없습니다.</p>";
            return;
        }

        Object.keys(data).reverse().forEach(key => {
            const p = data[key];
            const item = document.createElement("div");
            item.className = "post-item";
            item.onclick = () => location.href = `view.html?id=${key}`;
            item.innerHTML = `
                <div class="post-title">${p.title}</div>
                <div class="post-author">${p.author}</div>
            `;
            list.appendChild(item);
        });
    });
}
</script>
</body>
</html>
