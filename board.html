<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>DEEP SKY</title>
    <style>
        /* 1. 공통 스타일 */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", AppleSDGothicNeo-Regular, sans-serif; background: #0b0f2b; color: white; line-height: 1.8; }
        .hidden { display: none !important; }

        /* 2. 상단 바 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80;
            height: 60px; position: sticky; top: 0; z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        .logo-area span { font-size: 18px; font-weight: bold; letter-spacing: -0.5px; }

        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button {
            padding: 5px 12px; border-radius: 5px; border: none;
            background: #3a5aff; color: white; cursor: pointer; font-weight: bold;
        }

        /* 3. 헤더 및 내비게이션 */
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }
        nav { 
    background: #11153a; 
    border-bottom: 1px solid #2d367a; 
    padding: 10px 0; 
    /* 줄바꿈을 허용하기 위해 아래 두 줄 수정/삭제 */
    overflow-x: visible; 
    white-space: normal; 
}

nav .nav-inner { 
    max-width: 1200px;
    margin: 0 auto; 
    display: flex; 
    /* wrap으로 변경하여 공간이 부족하면 아래로 넘어가게 함 */
    flex-wrap: wrap; 
    justify-content: center; 
    gap: 5px; /* 줄바꿈 시 가독성을 위해 간격을 조금 넓힘 */
}
        nav a { color: white; padding: 12px 18px; text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 8px; }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 4. 본문 컨테이너 */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px 100px; }
        .intro-card { background: #161b4a; padding: 30px; border-radius: 20px; border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .intro-card h2 { color: #7fc7ff; border-left: 5px solid #3a5aff; padding-left: 15px; margin-bottom: 25px; font-size: 24px; }

        /* 검색 및 글쓰기 바 */
        .action-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-write { 
            background: #3a5aff; color: white; padding: 10px 20px; border-radius: 5px; 
            text-decoration: none; font-weight: bold; white-space: nowrap; display: flex; align-items: center;
        }
        .btn-write:hover { background: #2a47d6; text-decoration: none; }

        /* 게시판 리스트 */
        /*기존 .post-list, .post-item 관련 스타일이 있다면 지우고 아래 내용으로 교체하세요 */

/* 게시판 리스트 전체를 감싸는 영역 */
.post-list { 
    display: flex;
    flex-direction: column;
    gap: 15px; /* 박스들 사이의 간격 */
    min-height: 300px; 
    margin-top: 10px;
}

/* 글 하나하나를 담는 사각형 개별 박스 */
.post-item { 
    background: #1f265a; /* 박스 배경색 (기존보다 조금 더 밝게 강조) */
    border: 1px solid #2d367a;
    border-radius: 12px; /* 둥근 모서리 심화 */
    padding: 20px; 
    display: flex; 
    flex-direction: column; /* 세로 배열로 변경하여 구조 개선 */
    gap: 8px;
    transition: all 0.3s ease; 
    cursor: pointer;
}

/* 박스에 마우스를 올렸을 때 효과 */
.post-item:hover { 
    background: rgba(58, 90, 255, 0.15); 
    border-color: #3a5aff;
    transform: translateY(-2px); /* 위로 살짝 떠오르는 애니메이션 효과 */
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
}

/* 박스 내부의 윗줄 (제목 영역) */
.post-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* 글 제목 스타일 */
.post-title { 
    font-weight: bold; 
    color: #7fc7ff; 
    font-size: 18px; 
}

/* 글 번호 (인덱스) */
.post-index { 
    font-weight: bold; 
    color: #3a5aff; 
    margin-right: 10px; 
}

/* 박스 내부의 아랫줄 (작성자 및 업로드 시간 영역) */
.post-meta-row { 
    display: flex;
    justify-content: space-between; /* 작성자는 왼쪽, 업로드 시간은 오른쪽 */
    align-items: center;
    font-size: 13px; 
    color: #b0b5d0; /* 가독성을 위해 메타 데이터 색상 조정 */
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    padding-top: 8px;
    margin-top: 2px;
}

/* 업로드 시간 강조 스타일 */
.post-time {
    color: #a3b8cc;
    font-weight: 500;
}

        .del-btn { 
    background: #ff4d4d; 
    color: white; 
    border: none; 
    padding: 6px 14px; 
    border-radius: 6px; 
    cursor: pointer; 
    font-size: 13px; 
    font-weight: bold; 
    transition: background 0.2s;
}
.del-btn:hover { 
    background: #e60000; 
}

        /* 페이지네이션 */
        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 30px; }
        .page-num { 
            padding: 8px 15px; border: 1px solid #2d367a; background: #0b0f2b; 
            color: #7fc7ff; cursor: pointer; border-radius: 5px; transition: 0.2s;
        }
        .page-num:hover { background: #3a5aff; color: white; }
        .page-num.active { background: #3a5aff; color: white; border-color: #3a5aff; }

        footer { background: #070a1d; text-align: center; padding: 30px; font-size: 12px; color: #888; border-top: 1px solid #1b2f80; margin-top: 50px; }
        
        a:link, a:visited { color: #dedede; text-decoration: none; }
        a:hover { color: #b2b2b2; text-decoration: underline; }

        @media (max-width: 600px) {
            .logo-area span { font-size: 16px; }
            .nav a { padding: 10px 12px; font-size: 13px; }
            header h1 { font-size: 22px; }
            .action-bar { flex-direction: column; }
            .btn-write { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/35'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">불러오는 중...</span>
        <button id="loginBtn" class="hidden" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<header><h1>자유 게시판</h1></header>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html">자유 게시판</a>
        <a href="photo.html">활동사진</a>
        <a href="resource.html">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
        <a href="suggest.html">건의함</a>
        <a href="manage.html">등급 관리</a>
        <a href="block.html">등급 조정 요청</a>
        <a href="https://hq-syrtn.github.io/SYRTN/index.html">SYRTN</a>
    </div>
</nav>

<div class="container">
    <div class="intro-card">
        <h2>COMMUNITY</h2>  
        
        <div class="action-bar">
            <input type="text" id="searchInput" placeholder="제목 또는 작성자로 검색..." 
               style="flex: 1; background: #0b0f2b; color: white; border: 1px solid #2d367a; border-radius: 5px; padding: 10px 15px; outline: none; font-size: 14px;">
            <button onclick="filterPosts();" style="background: #3a5aff; color: white; border: none; border-radius: 5px; padding: 0 20px; cursor: pointer; font-weight: bold; transition: 0.2s;">
                검색
            </button>
            <a href="write.html" class="btn-write" id="topWriteBtn">글쓰기</a>
        </div>

        <div class="post-list" id="postList">
            <p style="text-align:center; padding:50px; color:#888;">게시글을 불러오는 중...</p>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>
</div>

<footer>
    © DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.
    <br>
    Email : leader.deepsky@gmail.com &nbsp;	&nbsp; &nbsp; &nbsp; | &nbsp; &nbsp; &nbsp; &nbsp; Designed by jw-astro09
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// 1. 파이어베이스 초기화 및 기본 설정
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const API_BASE_URL = "https://hypocrite-depletion-until.ngrok-free.dev";
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

let currentUser = null;
let currentUserRole = "guest";
let allPosts = [];
let displayPosts = [];
let currentPage = 1;
const postsPerPage = 10;

// 인증 상태 감시 및 회원 정보 등급 동기화
auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    const status = document.getElementById("userStatus");
    
    if (user) {
        document.getElementById("loginBtn")?.classList.add("hidden");
        document.getElementById("logoutBtn")?.classList.remove("hidden");
        
        try {
            const snapshot = await db.ref('users/' + user.uid).get();
            const userData = snapshot.val() || {};
            const currentUserName = userData.name || user.displayName || user.email.split('@')[0];
            currentUserRole = (user.email === ADMIN_EMAIL) ? 'admin' : (userData.role || 'member');
            
            if (status) status.innerText = `${currentUserName}님 (${currentUserRole==='admin'?'관리자':(currentUserRole==='student'?'부원':'일반')})`;
        } catch (e) {
            console.log("인증 복구 세션 동기화 중...");
        }
        
        await loadBoardPosts();
        });
    } else {
        currentUserRole = "guest";
        if (status) status.innerText = "로그인 해주세요";
        document.getElementById("loginBtn")?.classList.remove("hidden");
        document.getElementById("logoutBtn")?.classList.add("hidden");
        
        await loadBoardPosts();
    }
});

// 자체 서버 DB 연동 데이터 리스트 수신
async function loadBoardPosts() {
    try {
        const res = await fetch(`${API_BASE_URL}/api/freeboard`, {
            method: "GET",
            headers: { "ngrok-skip-browser-warning": "69420" }
        });
        if (!res.ok) throw new Error("서버 응답 오류");
        const data = await res.json();
        
        allPosts = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        
        allPosts.sort((a, b) => {
            const dateA = a.date || "";
            const dateB = b.date || "";
            return dateB.localeCompare(dateA); 
        });
        
        displayPosts = [...allPosts];
        renderPage();
    } catch (err) {
        console.error("게시판 로드 실패:", err);
        const list = document.getElementById("postList");
        if (list) list.innerHTML = `<p style="text-align:center; padding:50px; color:#ff4d4d;">서버 연결에 실패했습니다.</p>`;
    }
}

// 테이블 렌더링 함수
function renderPage() {
    const list = document.getElementById("postList");
    if (!list) return;
    list.innerHTML = "";

    const startIndex = (currentPage - 1) * postsPerPage;
    const endIndex = startIndex + postsPerPage;
    const paginatedPosts = displayPosts.slice(startIndex, endIndex);

    if (paginatedPosts.length === 0) {
        list.innerHTML = `<p style="text-align:center; padding:50px; color:#888;">등록된 게시글이 없습니다.</p>`;
        return;
    }

    paginatedPosts.forEach((p, idx) => {
        // 1. 개별 박스 엘리먼트(div) 생성
        const item = document.createElement("div");
        item.className = "post-item";
        
        // 박스 자체를 클릭하면 상세 페이지로 이동 (단, 삭제 버튼 클릭 시엔 이동 안 되게 처리 필요)
        item.onclick = () => location.href = `view.html?id=${p.id}`;

        const fileIcon = p.fileUrl ? " 📎" : "";
        const postNumber = displayPosts.length - (startIndex + idx);

        // 2. 박스 내부 기본 레이아웃 구성
        item.innerHTML = `
            <div class="post-header-row">
                <span class="post-title">
                    <span class="post-index"></span>${p.title || '제목 없음'}${fileIcon}
                </span>
                <div class="post-action-area"></div>
            </div>
            <div class="post-meta-row">
                <span>작성자: <strong>${p.author || '익명'}</strong></span>
                <span class="post-time">${p.date || '시간 미지정'}</span>
            </div>
        `;

        // 3. 💡 [핵심] 권한 체크 후 삭제 버튼 유동적 추가
        // 조건: 로그인한 사용자가 관리자(admin)이거나, 글의 작성자 UID와 현재 로그인한 유저의 UID가 일치할 때
        const isDeleteAuth = (currentUserRole === 'admin') || (currentUser && p.uid === currentUser.uid);

        if (isDeleteAuth) {
            const actionArea = item.querySelector(".post-action-area");
            
            // 삭제 버튼 생성
            const delBtn = document.createElement("button");
            delBtn.innerText = "삭제";
            delBtn.className = "del-btn"; // 기존에 정의해 두신 스타일 매칭
            
            // 삭제 버튼 클릭 이벤트
            delBtn.onclick = async (e) => {
                e.stopPropagation(); // 💡 중요: 삭제 버튼을 눌렀을 때 view.html로 이동하는 것을 막음
                
                if (confirm("정말로 이 게시글을 삭제하시겠습니까?")) {
                    try {
                        // 백엔드 app.py의 삭제 API(/api/freeboard/<post_id>) 호출
                        const token = await currentUser.getIdToken();
                        const res = await fetch(`${API_BASE_URL}/api/freeboard/${p.id}`, {
                            method: "DELETE",
                            headers: {
                                "Authorization": `Bearer ${token}`
                            }
                        });
                        
                        const result = await res.json();
                        if (res.ok && result.success) {
                            alert("성공적으로 삭제되었습니다.");
                            loadBoardPosts(); // 목록 새로고침
                        } else {
                            alert(`삭제 실패: ${result.error || "알 수 없는 오류"}`);
                        }
                    } catch (err) {
                        console.error("삭제 요청 중 에러 발생:", err);
                        alert("서버 통신 실패로 삭제하지 못했습니다.");
                    }
                }
            };
            
            actionArea.appendChild(delBtn);
        }

        list.appendChild(item);
    });

    renderPagination();
}

// 페이지네이션 제어
function renderPagination() {
    const paginArea = document.getElementById("pagination");
    if (!paginArea) return;
    paginArea.innerHTML = "";
    
    const totalPages = Math.ceil(displayPosts.length / postsPerPage);
    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.innerText = i;
        btn.className = `page-num ${i === currentPage ? 'active' : ''}`;
        btn.onclick = (e) => {
            e.stopPropagation();
            currentPage = i;
            renderPage();
            window.scrollTo(0, 0);
        };
        paginArea.appendChild(btn);
    }
}

// 글쓰기 권한 검사
function checkWriteAuth() {
    if (!currentUser) {
        alert("로그인이 필요합니다.");
        return;
    }
    location.href = "write.html";
}

function filterPosts() {
    const term = document.getElementById("searchInput").value.toLowerCase();
    if (!term) {
        loadBoardPosts();
        return;
    }
    const filtered = allPosts.filter(p => 
        (p.title && p.title.toLowerCase().includes(term)) || 
        (p.author && p.author.toLowerCase().includes(term))
    );
    allPosts = filtered;
    currentPage = 1;
    renderPage();
}

function logout() { if(confirm("로그아웃 하시겠습니까?")) auth.signOut().then(() => location.reload()); }
</script>
</body>
</html>
