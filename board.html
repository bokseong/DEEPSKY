<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>DEEP SKY</title>
    <style>
        /* 1. 공통 스타일 */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", AppleSDGothicNeo-Regular, sans-serif; background: #0b0f2b; color: white; line-height: 1.8; }
        .hidden { display: none !important; }

        /* 2. 상단 바 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80;
            height: 60px; position: sticky; top: 0; z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        .logo-area span { font-size: 18px; font-weight: bold; letter-spacing: -0.5px; }

        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button {
            padding: 5px 12px; border-radius: 5px; border: none;
            background: #3a5aff; color: white; cursor: pointer; font-weight: bold;
        }

        /* 3. 헤더 및 내비게이션 */
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }
        nav { background: #11153a; border-bottom: 1px solid #2d367a; padding: 10px 0; }
        .nav-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        nav a { color: white; padding: 12px 18px; text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 8px; }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 4. 본문 컨테이너 */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px 100px; }
        .intro-card { background: #161b4a; padding: 30px; border-radius: 20px; border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .intro-card h2 { color: #7fc7ff; border-left: 5px solid #3a5aff; padding-left: 15px; margin-bottom: 25px; font-size: 24px; }

        /* 게시판 리스트 */
        .post-list { border-radius: 10px; overflow: hidden; }
        .post-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; border-bottom: 1px solid rgba(58, 90, 255, 0.2); 
            transition: 0.3s; 
        }
        .post-item:hover { background: rgba(58, 90, 255, 0.1); }
        
        .post-info-area { cursor: pointer; flex-grow: 1; display: flex; align-items: center; justify-content: space-between; }
        .post-title { font-weight: bold; color: #7fc7ff; }
        .post-meta { font-size: 13px; color: #888; }

        /* 삭제 버튼 스타일 (빨간색 박스) */
        .del-btn { 
            background: #ff4d4d; color: white; border: none; 
            padding: 5px 12px; border-radius: 6px; cursor: pointer; 
            font-size: 12px; font-weight: bold; margin-left: 15px;
            white-space: nowrap;
        }
        .del-btn:hover { background: #e60000; }

        .btn-write { display: block; width: 100%; max-width: 150px; margin: 20px 0 0 auto; text-align: center; background: #3a5aff; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        footer { background: #070a1d; text-align: center; padding: 30px; font-size: 12px; color: #888; border-top: 1px solid #1b2f80; margin-top: 50px; }
        /* 방문 전(:link)과 방문 후(:visited)를 쉼표로 연결 */
        a:link, a:visited {
            color: #dedede;      
            text-decoration: none; /* 밑줄을 없애고 싶을 때 */
        }

        /* 마우스를 올렸을 때의 변화 (선택 사항) */
        a:hover {
            color: #b2b2b2;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .logo-area span { font-size: 16px; }
            nav a { padding: 10px 12px; font-size: 13px; }
            header h1 { font-size: 22px; }
            .header-logo { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/35'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">불러오는 중...</span>
        <button id="loginBtn" class="hidden" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<header><h1>자유 게시판</h1></header>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html">자유 게시판</a>
        <a href="photo.html">활동사진</a>
        <a href="resource.html">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
    </div>
</nav>

<div class="container">
    <div class="intro-card">
        <h2>COMMUNITY</h2>  
        <div style="display: flex; gap: 8px; margin-bottom: 20px;">
            <input type="text" id="searchInput" placeholder="제목 또는 작성자로 검색..." 
               style="flex: 1; background: #0b0f2b; color: white; border: 1px solid #2d367a; border-radius: 5px; padding: 10px 15px; outline: none; font-size: 14px;">
            <button onclick="loadPosts()" style="background: #3a5aff; color: white; border: none; border-radius: 5px; padding: 0 20px; cursor: pointer; font-weight: bold; transition: 0.2s;">
                검색
            </button>
        </div>
        <div class="post-list" id="postList">
            <p style="text-align:center; padding:50px; color:#888;">게시글을 불러오는 중...</p>
        </div>
        <a href="write.html" class="btn-write">글쓰기</a>
    </div>
</div>

<footer>
    © DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.
    <br>
    Email : leader.deepsky@gmail.com &nbsp;	&nbsp; &nbsp; &nbsp;|	&nbsp; &nbsp; &nbsp; &nbsp;Designed by jw-astro09
    <br>
    <a href="https://forms.gle/5MZf7MEZwNxAefXw9">시스템 오류 또는 오타 수정 건의하기</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const appCheck = firebase.appCheck();
appCheck.activate('6Leol8MsAAAAAJcS-pWEjPLZu4alKMIxiYYiDJI0', true);

const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;

// 인증 상태 감시 및 초기 로드
auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    const status = document.getElementById("userStatus");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    if (user) {
        db.ref('users/' + user.uid + '/name').on('value', (snapshot) => {
            status.innerText = `${snapshot.val() || user.displayName || "회원"}님`;
        });
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
    } else {
        status.innerText = "로그인 해주세요";
        loginBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
    }

    // App Check 확인 후 게시글 로드
    try {
        await appCheck.getToken();
        console.log("App Check 인증 완료. 데이터 로딩 시작.");
    } catch (e) {
        console.warn("App Check 대기 중...");
    }
    loadPosts();
});

function logout() { 
    if(confirm("로그아웃 하시겠습니까?")) {
        auth.signOut().then(() => { location.reload(); });
    }
}

async function loadPosts() {
    const list = document.getElementById("postList");
    const keyword = document.getElementById("searchInput") ? document.getElementById("searchInput").value.toLowerCase().trim() : "";

    // 실시간 리스너 연결 (기존 데이터 로직 그대로 유지)
    db.ref("freeboard").on("value", async (s) => {
        list.innerHTML = "";
        const data = s.val();
        
        if(!data) {
            list.innerHTML = "<p style='text-align:center; padding:40px; color:#888;'>등록된 글이 없습니다.</p>";
            return;
        }

        const keys = Object.keys(data).reverse();
        let hasResult = false;

        for (const key of keys) {
            const p = data[key];
            
            // 작성자 실시간 이름 조회
            let latestName = p.author || "익명";
            if (p.uid) {
                try {
                    const userSnap = await db.ref('users/' + p.uid + '/name').once('value');
                    if (userSnap.exists()) latestName = userSnap.val();
                } catch (e) {
                    console.log("작성자 정보 읽기 제한됨");
                }
            }

            // 검색 필터
            if (keyword !== "") {
                const titleMatch = (p.title || "").toLowerCase().includes(keyword);
                const authorMatch = latestName.toLowerCase().includes(keyword);
                if (!titleMatch && !authorMatch) continue;
            }
            
            hasResult = true;

            const item = document.createElement("div");
            item.className = "post-item";

            const infoArea = document.createElement("div");
            infoArea.className = "post-info-area";
            infoArea.onclick = () => location.href = `view.html?id=${key}`;
            infoArea.innerHTML = `
                <div class="post-title">${p.title}</div>
                <div class="post-meta">${latestName}</div>
            `;
            item.appendChild(infoArea);

            // 삭제 버튼 (관리자 또는 작성자)
            const adminEmail = "leader.deepsky@gmail.com";
            if(currentUser && (currentUser.uid === p.uid || currentUser.email === adminEmail)) {
                const delBtn = document.createElement("button");
                delBtn.className = "del-btn";
                delBtn.innerText = "삭제";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if(confirm("정말로 이 글을 삭제하시겠습니까?")) {
                        db.ref("freeboard/" + key).remove()
                        .then(() => alert("성공적으로 삭제되었습니다."))
                        .catch(err => alert("삭제 실패: " + err.message));
                    }
                };
                item.appendChild(delBtn);
            }
            list.appendChild(item);
        }

        if (!hasResult && keyword !== "") {
            list.innerHTML = `<p style='text-align:center; padding:40px; color:#888;'>'${keyword}'에 대한 검색 결과가 없습니다.</p>`;
        }
    }, (err) => {
        console.error("Firebase 로드 에러:", err);
    });
}

// 엔터키 검색
document.addEventListener("keyup", (e) => {
    if (e.key === "Enter" && document.activeElement.id === "searchInput") {
        loadPosts();
    }
});
</script>
</body>
</html>
