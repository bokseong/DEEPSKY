<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>DEEP SKY</title>
    <style>
        /* 1. 공통 스타일 */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", AppleSDGothicNeo-Regular, sans-serif; background: #0b0f2b; color: white; line-height: 1.8; }
        .hidden { display: none !important; }

        /* 2. 상단 바 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80;
            height: 60px; position: sticky; top: 0; z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        .logo-area span { font-size: 18px; font-weight: bold; letter-spacing: -0.5px; }

        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button {
            padding: 5px 12px; border-radius: 5px; border: none;
            background: #3a5aff; color: white; cursor: pointer; font-weight: bold;
        }

        /* 3. 헤더 및 내비게이션 */
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }
        nav { background: #11153a; border-bottom: 1px solid #2d367a; padding: 10px 0; }
        .nav-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        nav a { color: white; padding: 12px 18px; text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 8px; }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 4. 본문 컨테이너 */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px 100px; }
        .intro-card { background: #161b4a; padding: 30px; border-radius: 20px; border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .intro-card h2 { color: #7fc7ff; border-left: 5px solid #3a5aff; padding-left: 15px; margin-bottom: 25px; font-size: 24px; }

        /* 검색 및 글쓰기 바 */
        .action-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-write { 
            background: #3a5aff; color: white; padding: 10px 20px; border-radius: 5px; 
            text-decoration: none; font-weight: bold; white-space: nowrap; display: flex; align-items: center;
        }
        .btn-write:hover { background: #2a47d6; text-decoration: none; }

        /* 게시판 리스트 */
        .post-list { border-radius: 10px; overflow: hidden; min-height: 400px; }
        .post-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; border-bottom: 1px solid rgba(58, 90, 255, 0.2); 
            transition: 0.3s; 
        }
        .post-item:hover { background: rgba(58, 90, 255, 0.1); }
        
        .post-info-area { cursor: pointer; flex-grow: 1; display: flex; align-items: center; justify-content: space-between; }
        .post-title { font-weight: bold; color: #7fc7ff; }
        .post-meta { font-size: 13px; color: #aaa; }

        .del-btn { 
            background: #ff4d4d; color: white; border: none; 
            padding: 5px 12px; border-radius: 6px; cursor: pointer; 
            font-size: 12px; font-weight: bold; margin-left: 15px;
            white-space: nowrap;
        }
        .del-btn:hover { background: #e60000; }

        /* 페이지네이션 */
        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 30px; }
        .page-num { 
            padding: 8px 15px; border: 1px solid #2d367a; background: #0b0f2b; 
            color: #7fc7ff; cursor: pointer; border-radius: 5px; transition: 0.2s;
        }
        .page-num:hover { background: #3a5aff; color: white; }
        .page-num.active { background: #3a5aff; color: white; border-color: #3a5aff; }

        footer { background: #070a1d; text-align: center; padding: 30px; font-size: 12px; color: #888; border-top: 1px solid #1b2f80; margin-top: 50px; }
        
        a:link, a:visited { color: #dedede; text-decoration: none; }
        a:hover { color: #b2b2b2; text-decoration: underline; }

        @media (max-width: 600px) {
            .logo-area span { font-size: 16px; }
            .nav a { padding: 10px 12px; font-size: 13px; }
            header h1 { font-size: 22px; }
            .action-bar { flex-direction: column; }
            .btn-write { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/35'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">불러오는 중...</span>
        <button id="loginBtn" class="hidden" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<header><h1>자유 게시판</h1></header>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html">자유 게시판</a>
        <a href="photo.html">활동사진</a>
        <a href="resource.html">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
        <a href="suggest.html">건의함</a>
        <a href="manage.html">등급 관리</a>
        <a href="block.html">등급 조정 요청</a>
    </div>
</nav>

<div class="container">
    <div class="intro-card">
        <h2>COMMUNITY</h2>  
        
        <div class="action-bar">
            <input type="text" id="searchInput" placeholder="제목 또는 작성자로 검색..." 
               style="flex: 1; background: #0b0f2b; color: white; border: 1px solid #2d367a; border-radius: 5px; padding: 10px 15px; outline: none; font-size: 14px;">
            <button onclick="currentPage=1; loadPosts();" style="background: #3a5aff; color: white; border: none; border-radius: 5px; padding: 0 20px; cursor: pointer; font-weight: bold; transition: 0.2s;">
                검색
            </button>
            <a href="write.html" class="btn-write" id="topWriteBtn">글쓰기</a>
        </div>

        <div class="post-list" id="postList">
            <p style="text-align:center; padding:50px; color:#888;">게시글을 불러오는 중...</p>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>
</div>

<footer>
    © DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.
    <br>
    Email : leader.deepsky@gmail.com &nbsp;	&nbsp; &nbsp; &nbsp; | &nbsp; &nbsp; &nbsp; &nbsp; Designed by jw-astro09
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const appCheck = firebase.appCheck();
appCheck.activate('6Leol8MsAAAAAJcS-pWEjPLZu4alKMIxiYYiDJI0', true);

const ADMIN_EMAIL = "leader.deepsky@gmail.com";
let currentUser = null;
let currentUserRole = "guest";

// 페이지네이션 설정
let currentPage = 1;
const postsPerPage = 10;
let allPosts = []; // 필터링된 모든 게시글을 담을 배열

auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    const status = document.getElementById("userStatus");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const topWriteBtn = document.getElementById("topWriteBtn");

    if (user) {
        db.ref('users/' + user.uid).on('value', (snapshot) => {
            const userData = snapshot.val() || {};
            const finalName = userData.name || user.email.split('@')[0];
            currentUserRole = (user.email === ADMIN_EMAIL) ? 'admin' : (userData.role || 'member');
            if(status) status.innerText = `${finalName}님 (${getRoleName(currentUserRole)})`;
            if (topWriteBtn) topWriteBtn.classList.remove("hidden");
        });
        loginBtn?.classList.add("hidden");
        logoutBtn?.classList.remove("hidden");
    } else {
        currentUserRole = "guest";
        if(status) status.innerText = "로그인 해주세요";
        loginBtn?.classList.remove("hidden");
        logoutBtn?.classList.add("hidden");
        if (topWriteBtn) topWriteBtn.classList.add("hidden");
    }
    loadPosts();
});

function getRoleName(role) {
    switch(role) {
        case 'admin': return '관리자';
        case 'student': return '동아리 부원';
        default: return '일반 회원';
    }
}

function formatDate(timestamp) {
    if (!timestamp) return "시간 정보 없음";
    const date = new Date(timestamp);
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
}

async function loadPosts() {
    const list = document.getElementById("postList");
    const keyword = document.getElementById("searchInput")?.value.toLowerCase().trim() || "";

    db.ref("freeboard").off(); // 중복 리스너 방지
    db.ref("freeboard").on("value", (snapshot) => {
        const data = snapshot.val();
        if(!data) {
            list.innerHTML = "<p style='text-align:center; padding:40px; color:#888;'>등록된 글이 없습니다.</p>";
            document.getElementById("pagination").innerHTML = "";
            return;
        }

        // 1. 전체 게시글을 배열로 변환 및 정렬
        const keys = Object.keys(data).sort((a, b) => {
            const timeA = data[a].createdAt || data[a].updatedAt || 0;
            const timeB = data[b].createdAt || data[b].updatedAt || 0;
            return timeB - timeA;
        });

        // 2. 검색 필터링
        allPosts = keys.map(key => ({ id: key, ...data[key] })).filter(p => {
            const authorName = p.author || "익명";
            return p.title.toLowerCase().includes(keyword) || authorName.toLowerCase().includes(keyword);
        });

        renderPage();
    });
}

function renderPage() {
    const list = document.getElementById("postList");
    const paginArea = document.getElementById("pagination");
    list.innerHTML = "";
    
    if (allPosts.length === 0) {
        list.innerHTML = "<p style='text-align:center; padding:40px; color:#888;'>검색 결과가 없습니다.</p>";
        paginArea.innerHTML = "";
        return;
    }

    // 3. 페이지 슬라이싱 (10개씩)
    const startIndex = (currentPage - 1) * postsPerPage;
    const endIndex = startIndex + postsPerPage;
    const pagePosts = allPosts.slice(startIndex, endIndex);

    // 4. 화면 출력
    pagePosts.forEach(p => {
        const item = document.createElement("div");
        item.className = "post-item";
        
        const displayTime = p.createdAt || p.updatedAt || 0;
        const authorName = p.author || "익명";

        let html = `
            <div class="post-info-area" onclick="location.href='view.html?id=${p.id}'">
                <div>
                    <div class="post-title">${p.title}</div>
                    <div class="post-meta">${authorName} | ${formatDate(displayTime)}</div>
                </div>
            </div>
        `;
        item.innerHTML = html;

        // 삭제 권한 확인
        if(currentUser && (currentUser.uid === p.uid || currentUserRole === 'admin')) {
            const delBtn = document.createElement("button");
            delBtn.className = "del-btn";
            delBtn.innerText = "삭제";
            delBtn.onclick = (e) => deletePost(e, p.id);
            item.appendChild(delBtn);
        }
        list.appendChild(item);
    });

    // 5. 페이지네이션 버튼 생성
    renderPagination();
}

function renderPagination() {
    const paginArea = document.getElementById("pagination");
    paginArea.innerHTML = "";
    
    const totalPages = Math.ceil(allPosts.length / postsPerPage);
    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.innerText = i;
        btn.className = `page-num ${i === currentPage ? 'active' : ''}`;
        btn.onclick = () => {
            currentPage = i;
            renderPage();
            window.scrollTo(0, 0); // 페이지 이동 시 상단으로 이동
        };
        paginArea.appendChild(btn);
    }
}

async function deletePost(e, key) {
    e.stopPropagation();
    if(confirm("정말로 이 글을 삭제하시겠습니까?")) {
        try {
            await appCheck.getToken(false);
            await db.ref("freeboard/" + key).remove();
            alert("성공적으로 삭제되었습니다.");
        } catch (err) {
            alert("삭제 실패: 권한이 없거나 네트워크 오류입니다.");
        }
    }
}

document.getElementById("searchInput")?.addEventListener("keyup", (e) => {
    if (e.key === "Enter") {
        currentPage = 1;
        loadPosts();
    }
});

function logout() { 
    if(confirm("로그아웃 하시겠습니까?")) {
        auth.signOut().then(() => { location.reload(); });
    }
}
</script>
</body>
</html>
