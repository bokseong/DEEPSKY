<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자유 게시판 - DEEP SKY</title>
    <style>
        /* 1. 인덱스 스타일 계승 */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", "Segoe UI", sans-serif; background: #0b0f2b; color: white; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* 상단 바 & 내비게이션 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 40px; height: 40px; margin-right: 12px; border-radius: 50%; }
        .logo-area span { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button { padding: 7px 16px; border-radius: 5px; border: none; background: #3a5aff; color: white; cursor: pointer; font-weight: bold; }
        
        nav { background: #11153a; border-bottom: 1px solid #2d367a; padding: 10px 0; }
        nav .nav-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        nav a { display: inline-block; color: white; padding: 12px 18px; text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 8px; transition: 0.2s; }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 2. 게시판 전용 스타일 */
        .container { max-width: 1000px; margin: 35px auto; padding: 0 20px 100px; }
        .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-write { padding: 10px 20px; background: #3a5aff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn-write.disabled { background: #444; cursor: not-allowed; } /* 로그인 안됐을 때 스타일 */
        
        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1b2f80; background: #161b4a; color: white; font-size: 15px; outline: none; }

        .post-list { background: #161b4a; border-radius: 15px; border: 1px solid #2d367a; overflow: hidden; }
        .post-item { display: grid; grid-template-columns: 1fr 150px 120px; padding: 18px 25px; border-bottom: 1px solid #2d367a; cursor: pointer; transition: 0.2s; }
        .post-item:last-child { border-bottom: none; }
        .post-item:hover { background: rgba(58, 90, 255, 0.1); }
        .post-title { font-weight: bold; color: #7fc7ff; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-meta { color: #aaa; text-align: right; font-size: 14px; }

        footer { background: #070a1d; text-align: center; padding: 35px 20px; color: #888; border-top: 1px solid #1b2f80; font-size: 13px; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/40'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">접속 중...</span>
        <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html" style="color: #7fc7ff; background: rgba(127, 199, 255, 0.1);">자유 게시판</a>
        <a href="activity.html">활동 사진</a>
        <a href="resource.html">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
    </div>
</nav>

<div class="container">
    <div class="board-header">
        <h2 style="margin:0; color:#7fc7ff;">자유 게시판</h2>
        <button id="writeActionBtn" class="btn-write" onclick="checkLoginForWrite()">글쓰기</button>
    </div>

    <div class="search-box">
        <input type="text" id="boardSearch" onkeyup="filterPosts()" placeholder="제목 또는 작성자 검색...">
    </div>

    <div class="post-list" id="postList">
        <p style="padding:40px; text-align:center; color:#888;">게시글을 불러오는 중...</p>
    </div>
</div>

<footer>© DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// 파이어베이스 설정
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let isLogined = false;

// 로그인 상태 감지
auth.onAuthStateChanged(user => {
    const status = document.getElementById("userStatus");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const writeBtn = document.getElementById("writeActionBtn");

    if (user) {
        isLogined = true;
        db.ref('users/' + user.uid + '/name').on('value', (snapshot) => {
            const finalName = snapshot.val() || user.displayName || user.email.split('@')[0];
            status.innerText = `${finalName}님`;
        });
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
        writeBtn.classList.remove("disabled"); // 버튼 활성화 스타일
    } else {
        isLogined = false;
        status.innerText = "로그인 해주세요";
        loginBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        writeBtn.classList.add("disabled"); // 버튼 비활성화 스타일 (선택사항)
    }
    loadPosts();
});

//글쓰기 버튼 클릭 시 실행될 함수
function checkLoginForWrite() {
    if (!isLogined) {
        alert("로그인한 사용자만 글을 작성할 수 있습니다.");
        location.href = 'login.html';
    } else {
        location.href = 'write.html';
    }
}

function loadPosts() {
    db.ref("freeboard").on("value", snapshot => {
        renderPosts(snapshot.val());
    });
}

function renderPosts(data) {
    const list = document.getElementById("postList");
    const searchTerm = document.getElementById("boardSearch").value.toLowerCase();
    list.innerHTML = "";

    if (!data) {
        list.innerHTML = '<p style="padding:40px; text-align:center; color:#888;">등록된 게시글이 없습니다.</p>';
        return;
    }

    const keys = Object.keys(data).reverse();
    let hasMatch = false;

    keys.forEach(key => {
        const post = data[key];
        const title = post.title || "제목 없음";
        const author = post.author || "익명";
        
        if (title.toLowerCase().includes(searchTerm) || author.toLowerCase().includes(searchTerm)) {
            hasMatch = true;
            const item = document.createElement("div");
            item.className = "post-item";
            // 상세보기 기능 (준비중)
            item.onclick = () => alert("상세보기 페이지 준비 중입니다!\n\n제목: " + title + "\n작성자: " + author + "\n내용: " + post.content); 
            item.innerHTML = `
                <div class="post-title">${title}</div>
                <div class="post-meta">${author}</div>
                <div class="post-meta" style="color:#666;">${new Date(post.createdAt).toLocaleDateString()}</div>
            `;
            list.appendChild(item);
        }
    });

    if (!hasMatch && searchTerm) {
        list.innerHTML = '<p style="padding:40px; text-align:center; color:#888;">검색 결과가 없습니다.</p>';
    }
}

function filterPosts() {
    db.ref("freeboard").once("value", snapshot => renderPosts(snapshot.val()));
}

function logout() { 
    if(confirm("로그아웃 하시겠습니까?")) {
        auth.signOut().then(() => location.reload());
    }
}
</script>
</body>
</html>
