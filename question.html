<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>DEEP SKY</title>
    <style>
        /* 기존 디자인 유지 */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", sans-serif; background: #0b0f2b; color: white; line-height: 1.6; }
        .hidden { display: none !important; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 60px; position: sticky; top:0; z-index:1000; }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        .logo-area span { font-size: 18px; font-weight: bold; }
        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button { padding: 5px 12px; border-radius: 5px; border: none; background: #3a5aff; color: white; cursor: pointer; font-weight: bold; }
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }
        nav { 
    background: #11153a; 
    border-bottom: 1px solid #2d367a; 
    padding: 10px 0; 
    /* 줄바꿈을 허용하기 위해 아래 두 줄 수정/삭제 */
    overflow-x: visible; 
    white-space: normal; 
}

nav .nav-inner { 
    max-width: 1200px;
    margin: 0 auto; 
    display: flex; 
    /* wrap으로 변경하여 공간이 부족하면 아래로 넘어가게 함 */
    flex-wrap: wrap; 
    justify-content: center; 
    gap: 5px; /* 줄바꿈 시 가독성을 위해 간격을 조금 넓힘 */
}
        nav a { display: inline-block; color: white; padding: 12px 18px; text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 8px; }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px 100px; }
        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1b2f80; background: #161b4a; color: white; font-size: 15px; outline: none; }
        .write-card { background: #161b4a; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2d367a; }
        .write-card input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1b2f80; background: #0b0f2b; color: white; margin-bottom: 10px; outline: none; }
        .btn-main { width: 100%; padding: 12px; background: #3a5aff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .q-card { background: #161b4a; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2d367a; }
        .q-meta { font-size: 12px; color: #7fc7ff; margin-bottom: 8px; }
        .q-text { font-weight: bold; font-size: 16px; margin-bottom: 15px; display: block; border-bottom: 1px solid #2d367a; padding-bottom: 10px; color: #fff; }
        .replies-container { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .ans-box { background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 8px; border-left: 3px solid #28a745; position: relative; }
        .ans-content { font-size: 14px; color: #eee; line-height: 1.4; padding-right: 30px; word-break: break-all; overflow-wrap: break-word; }
        .ans-author { font-size: 11px; color: #7fc7ff; margin-top: 5px; display: block; font-weight: bold; }
        .answer-controls { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #2d367a; display: flex; gap: 5px; }
        .answer-controls input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #1b2f80; background: #0b0f2b; color: white; outline: none; }
        .btn-ans { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-del { background: #ff4d4d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-ans-del { background: none; border: none; color: #ff4d4d; font-size: 11px; cursor: pointer; font-weight: bold; padding: 0; margin-top: 5px; }
        footer { background: #070a1d; text-align: center; padding: 30px 20px; font-size: 12px; color: #888; border-top: 1px solid #1b2f80; width: 100%; margin-top: 50px; }
        a:link, a:visited { color: #dedede; text-decoration: none; }
        a:hover { color: #b2b2b2; text-decoration: underline; }
        @media (max-width: 600px) { .logo-area span { font-size: 16px; } nav a { padding: 10px 12px; font-size: 13px; } header h1 { font-size: 22px; } }
    </style>
</head>
<body>
<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/35'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">접속 중...</span>
        <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>
<header><h1>질문 게시판</h1></header>
<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html">자유 게시판</a>
        <a href="photo.html">활동 사진</a>
        <a href="resource.html">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
        <a href="suggest.html">건의함</a>
        <a href="manage.html">등급 관리</a>
        <a href="block.html">등급 조정 요청</a>
        <a href="https://hq-syrtn.github.io/SYRTN/index.html">SYRTN</a>
    </div>
</nav>
<div class="container">
    <div class="search-box">
        <input type="text" id="qSearch" onkeyup="filterQuestions()" placeholder="질문 내용, 작성자, 답글을 검색하세요...">
    </div>
    <div class="write-card">
        <input type="text" id="qInput" placeholder="질문 내용을 입력하세요. (비로그인은 익명) 최대한 빠르게 답변하겠습니다!">
        <button class="btn-main" onclick="addQuestion()">질문 등록</button>
    </div>
    <div id="questionList">
        <p style="text-align:center;">데이터를 불러오는 중입니다...</p>
    </div>
</div>
<footer>
    © DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.
    <br>
    Email : leader.deepsky@gmail.com &nbsp; &nbsp; &nbsp; &nbsp;| &nbsp; &nbsp; &nbsp; &nbsp;Designed by jw-astro09
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const appCheck = firebase.appCheck();
appCheck.activate('6Leol8MsAAAAAJcS-pWEjPLZu4alKMIxiYYiDJI0', true);

// 💡 5001번 우분투 ngrok 백엔드 서버 연동용 기본 설정 주소 추가
const API_BASE_URL = "https://hypocrite-depletion-until.ngrok-free.dev";
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

let currentUser = null;
let currentUserName = "익명";
let currentUserRole = "guest";
let cachedData = null;

auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    const status = document.getElementById("userStatus");
    if (user) {
        db.ref('users/' + user.uid).on('value', (snapshot) => {
            const userData = snapshot.val() || {};
            currentUserName = userData.name || user.displayName || user.email.split('@')[0];
            currentUserRole = (user.email === ADMIN_EMAIL) ? 'admin' : (userData.role || 'member');
            if (status) status.innerText = `${currentUserName}님 (${currentUserRole==='admin'?'관리자':(currentUserRole==='student'?'부원':'일반')})`;
            renderList(cachedData);
        });
        document.getElementById("loginBtn")?.classList.add("hidden");
        document.getElementById("logoutBtn")?.classList.remove("hidden");
    } else {
        currentUserName = "익명";
        currentUserRole = "guest";
        if (status) status.innerText = "로그인 해주세요";
        document.getElementById("loginBtn")?.classList.remove("hidden");
        document.getElementById("logoutBtn")?.classList.add("hidden");
        renderList(cachedData);
    }
    loadQuestions();
});

// 💡 질문 리스트 로드 (자체 5001번 ngrok 서버와 실시간으로 실존 연동)
async function loadQuestions() {
    try {
        // ngrok 우회 헤더 마법의 주문 탑재 및 백엔드 GET 호출
        const response = await fetch(`${API_BASE_URL}/api/question`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
                "ngrok-skip-browser-warning": "69420"
            }
        });
        if (!response.ok) throw new Error("서버에서 질문을 읽어오지 못했습니다.");
        
        cachedData = await response.json(); // 질문 내용(db에 question 구조) 받아옴
        renderList(cachedData);
    } catch (error) {
        console.error("질문 로드 실패:", error);
        document.getElementById("questionList").innerHTML = `<p style="text-align:center; color:#ff4d4d;">서버 연동 오류 (백엔드가 오프라인 상태일 수 있습니다.)</p>`;
    }
}

// 💡 새로운 질문 등록 (자체 5001번 ngrok 서버 연동 및 보안 규칙 매칭 버전)
async function addQuestion() {
    const textInput = document.getElementById("qInput");
    const text = textInput.value.trim();
    if(!text) return alert("질문을 입력해주세요.");

    try {
        // 보안 규칙을 통과하고 우분투 DB에 question 항목으로 적재될 데이터 구조화
        const newPost = {
            text: text,
            author: currentUserName,
            email: currentUser ? currentUser.email : "anonymous",
            uid: currentUser ? currentUser.uid : "anonymous_uid",
            timestamp: Date.now(),
            date: new Date().toLocaleDateString('ko-KR')
        };

        // 백엔드로 POST 전송
        const response = await fetch(`${API_BASE_URL}/api/question`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "ngrok-skip-browser-warning": "69420"
            },
            body: JSON.stringify(newPost)
        });

        if(!response.ok) throw new Error("서버 저장에 실패했습니다.");
        
        textInput.value = "";
        alert("질문이 등록되었습니다.");
        loadQuestions(); // 갱신된 리스트 새로 불러오기
    } catch (err) { 
        alert("등록 실패: 서버 및 보안 규칙 상태를 확인하세요."); 
    }
}

// 💡 답변 등록 (각 질문 내부 하위 항목에 replies-reply 배열 형식 구조화 연동)
async function saveAnswer(qKey) {
    if(currentUserRole !== 'admin' && currentUserRole !== 'student') return alert("답변 권한이 없습니다.");
    const ansInput = document.getElementById("ans_"+qKey);
    const ansText = ansInput.value.trim();
    if(!ansText) return alert("내용을 입력하세요.");

    try {
        // 기존 객체 내의 원본 질문 데이터 추적
        const qData = cachedData[qKey];

        const newReply = {
            text: ansText,
            author: currentUserName,
            email: currentUser.email,
            uid: currentUser.uid,
            timestamp: Date.now()
        };

        // 특정 qKey 질문의 하위 replies 경로로 POST 통신 진행
        const response = await fetch(`${API_BASE_URL}/api/question/${qKey}/reply`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "ngrok-skip-browser-warning": "69420"
            },
            body: JSON.stringify(newReply)
        });

        if(!response.ok) throw new Error("서버에 답변을 추가하지 못했습니다.");

        ansInput.value = "";
        loadQuestions(); // 등록 완료 후 갱신
    } catch (err) { 
        alert("등록 실패."); 
    }
}

// 💡 화면 렌더링 로직 (기존 HTML 돔 구조 및 CSS 속성 완벽 호환)
function renderList(data) {
    const list = document.getElementById("questionList");
    const searchTerm = document.getElementById("qSearch").value.toLowerCase();
    list.innerHTML = "";
    if(!data || Object.keys(data).length === 0) {
        list.innerHTML = `<p style="text-align:center; padding:20px; color:#888;">등록된 질문이 없습니다.</p>`;
        return;
    }
    
    const canReply = (currentUserRole === 'admin' || currentUserRole === 'student');
    const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

    // 파이어베이스 기존 실시간 내림차순 정렬 로직 보존하며 렌더링
    Object.keys(data).reverse().forEach(qKey => {
        const q = data[qKey];
        const isQAuthor = currentUser && q.email !== "anonymous" && currentUser.email === q.email;
        
        // 검색 필터 검증 (질문 본문, 작성자 명칭 포함 여부 검사)
        if (searchTerm && !q.text.toLowerCase().includes(searchTerm) && !q.author.toLowerCase().includes(searchTerm)) return;

        let repliesHtml = '<div class="replies-container">';
        if (q.replies) {
            Object.keys(q.replies).forEach(rKey => {
                const r = q.replies[rKey];
                const canDeleteReply = isAdmin || (currentUser && currentUser.email === r.email) || isQAuthor;
                
                repliesHtml += `
                    <div class="ans-box">
                        <div class="ans-content"><b>A.</b> ${r.text} <br> <span class="ans-author">- ${r.author}</span></div>
                        ${canDeleteReply ? `<button class="btn-ans-del" onclick="deleteAnswer('${qKey}', '${rKey}')">삭제</button>` : ""}
                    </div>`;
            });
        }
        repliesHtml += '</div>';

        const card = document.createElement("div");
        card.className = "q-card";
        const canDeleteQuestion = isAdmin || isQAuthor;

        let controlsHtml = canReply ? `
            <div class="answer-controls">
                <input type="text" id="ans_${qKey}" placeholder="답글 입력..." onkeypress="if(event.key==='Enter') saveAnswer('${qKey}')">
                <button class="btn-ans" onclick="saveAnswer('${qKey}')">등록</button>
                ${canDeleteQuestion ? `<button class="btn-del" onclick="deleteQuestion('${qKey}')">삭제</button>` : ""}
            </div>` : (canDeleteQuestion ? `<div class="answer-controls" style="justify-content: flex-end;"><button class="btn-del" onclick="deleteQuestion('${qKey}')">삭제</button></div>` : "");

        card.innerHTML = `<div class="q-meta">${q.author}</div><span class="q-text">Q. ${q.text}</span>${repliesHtml}${controlsHtml}`;
        list.appendChild(card);
    });
}

function filterQuestions() { renderList(cachedData); }

// 💡 질문 전전체 삭제 연동 함수
async function deleteQuestion(qKey) { 
    if(!confirm("삭제하시겠습니까?")) return;
    try {
        const response = await fetch(`${API_BASE_URL}/api/question/${qKey}`, {
            method: "DELETE",
            headers: { "ngrok-skip-browser-warning": "69420" }
        });
        if (!response.ok) throw new Error();
        alert("삭제되었습니다.");
        loadQuestions();
    } catch(e) {
        alert("삭제 권한이 없거나 서버 에러가 발생했습니다.");
    }
}

// 💡 답글 단일 삭제 연동 함수
async function deleteAnswer(qKey, rKey) { 
    if(!confirm("삭제하시겠습니까?")) return;
    try {
        const response = await fetch(`${API_BASE_URL}/api/question/${qKey}/reply/${rKey}`, {
            method: "DELETE",
            headers: { "ngrok-skip-browser-warning": "69420" }
        });
        if (!response.ok) throw new Error();
        alert("삭제되었습니다.");
        loadQuestions();
    } catch(e) {
        alert("답변 삭제 권한이 없거나 실패했습니다.");
    }
}

function logout() { if(confirm("로그아웃 하시겠습니까?")) auth.signOut().then(() => location.reload()); }
</script>
</body>
</html>
