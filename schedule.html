<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="logo.png" type="image/png">
  <title>DEEP SKY | Schedule</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
<div class="auth-bar"><a href="index.html" class="logo-link"><img src="logo.png" alt="DEEP SKY logo" class="nav-logo"><span>DEEP SKY</span></a><div class="auth-user-zone"><span id="user-name"></span><button id="logout-btn" class="auth-btn">LOGOUT</button></div></div>
<header class="hero"><h1>Observation Schedule</h1><p>학교별 관측 계획과 준비 항목을 공유합니다.</p></header>
<nav class="sub-nav-container" aria-label="주요 메뉴"><div class="nav-menu"><a href="index.html">HOME</a><a href="introduction.html">INTRODUCTION</a><a href="talk.html">TALK</a><a href="resource.html">RESOURCE</a><a href="suggest.html">SUGGESTION</a><a href="mypage.html">MY PAGE</a><a href="adjust.html">REQUEST AUTHORITY</a><a href="admin.html">ADMIN</a></div></nav>
<main class="feature-main">
  <div class="split-layout">
    <section class="feature-section">
      <div class="section-heading-row"><h1 class="section-title">관측 일정</h1><div class="item-actions"><button class="btn btn-primary" type="button" data-period="upcoming">예정</button><button class="btn" type="button" data-period="past">지난 일정</button></div></div>
      <div id="event-list" class="feature-list"><div class="loading-state">일정을 불러오는 중입니다.</div></div>
    </section>
    <form id="event-form" class="compact-form" hidden>
      <h2 id="event-form-title">새 일정</h2>
      <input id="event-id" type="hidden">
      <label for="event-title">일정명</label><input id="event-title" maxlength="120" required>
      <label for="event-scope">공개 범위</label><select id="event-scope"><option value="all">전체</option></select>
      <label for="event-start">시작</label><input id="event-start" type="datetime-local" required>
      <label for="event-end">종료</label><input id="event-end" type="datetime-local">
      <label for="event-location">장소</label><input id="event-location" maxlength="160">
      <label for="event-target">관측 대상</label><input id="event-target" maxlength="120">
      <label for="event-description">설명</label><textarea id="event-description" maxlength="3000"></textarea>
      <label for="event-checklist">준비 항목</label><textarea id="event-checklist" maxlength="2000" placeholder="항목마다 줄을 바꿔 입력"></textarea>
      <div id="event-form-status" class="form-status" role="status"></div>
      <div class="actions"><button id="event-reset-btn" class="btn" type="button">초기화</button><button class="btn btn-primary" type="submit">저장</button></div>
    </form>
  </div>
</main>
<footer><p>&copy; 2026 DEEP SKY. All Rights Reserved.</p><p>복성고등학교 천문·항공우주 동아리</p><p>Designed by DEEP SKY | Contact: leader.deepsky@gmail.com</p></footer>
<script type="module" src="js/schedule.js"></script>
<script type="module" src="frontend-access-control.js"></script>
</body>
</html>
