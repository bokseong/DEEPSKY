<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보 수정 - DEEP SKY</title>
    <style>
        /* 1. 공통 스타일 */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", sans-serif; background: #0b0f2b; color: white; }

        .hidden { display: none !important; }

        /* 2. 상단 바 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80;
            height: 60px; position: sticky; top: 0; z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        .logo-area span { font-size: 18px; font-weight: bold; }

        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button {
            padding: 5px 12px; border-radius: 5px; border: none;
            background: #3a5aff; color: white; cursor: pointer; font-weight: bold;
        }

        /* 3. 헤더 및 내비게이션 (디자인 통일) */
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 40px 20px; text-align: center; }
        nav { 
            background: #11153a; 
            border-bottom: 1px solid #2d367a; 
            padding: 10px 0;
        }
        nav .nav-inner { 
            max-width: 1000px; 
            margin: 0 auto; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 5px; 
        }
        nav a { 
            display: inline-block; 
            color: white; 
            padding: 12px 18px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 15px; 
            border-radius: 8px;
        }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 4. 본문 컨테이너 */
        .container { max-width: 600px; margin: 30px auto; padding: 0 20px 100px; }
        
        .card { 
            background: #161b4a; padding: 30px; border-radius: 15px; 
            border: 1px solid #2d367a; margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .info-group { margin-bottom: 20px; }
        .info-group label { display: block; font-size: 13px; color: #7fc7ff; margin-bottom: 8px; font-weight: bold; }
        .info-group input { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1b2f80; 
            background: #0b0f2b; color: white; font-size: 15px; outline: none;
        }
        .info-group input:disabled { background: #070a1d; color: #666; cursor: not-allowed; }
        .info-group input:focus { border-color: #3a5aff; }

        .btn-save { 
            width: 100%; padding: 14px; background: #3a5aff; color: white; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; 
            font-size: 16px; transition: background 0.3s; margin-bottom: 10px;
        }
        .btn-save:hover { background: #2846d1; }

        .btn-pw-reset {
            width: 100%; padding: 12px; background: transparent; color: #7fc7ff;
            border: 1px solid #3a5aff; border-radius: 8px; font-weight: bold; cursor: pointer;
            font-size: 14px; transition: 0.3s;
        }
        .btn-pw-reset:hover { background: rgba(58, 90, 255, 0.1); }

        .danger-zone { 
            margin-top: 40px; border-top: 1px solid #2d367a; padding-top: 25px; 
            text-align: center;
        }
        .danger-zone p { font-size: 13px; color: #888; margin-bottom: 15px; }
        .btn-withdraw { 
            background: #ff4d4d; color: white; border: none; 
            padding: 10px 20px; border-radius: 6px; cursor: pointer; 
            font-weight: bold; font-size: 13px;
        }

        footer { 
            background: #070a1d; text-align: center; padding: 30px 20px;
            font-size: 12px; color: #888; border-top: 1px solid #1b2f80; 
            width: 100%; margin-top: 50px;
        }

        @media (max-width: 600px) {
            .logo-area span { font-size: 16px; }
            nav a { padding: 10px 12px; font-size: 13px; }
            header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/35'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">불러오는 중...</span>
        <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<header><h1>정보 수정</h1></header>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="activity.html">활동 사진</a>
        <a href="resource.html">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h3 style="color: #7fc7ff; margin-top: 0; margin-bottom: 25px; text-align: center;">내 프로필 관리</h3>
        
        <div class="info-group">
            <label>활동 이름 (닉네임)</label>
            <input type="text" id="userName" placeholder="이름을 불러오는 중...">
        </div>
        <button class="btn-save" onclick="updateProfile()">이름 변경 저장</button>

        <hr style="border: 0; border-top: 1px solid #1b2f80; margin: 30px 0;">

        <h3 style="color: #7fc7ff; margin-bottom: 20px; text-align: center; font-size: 18px;">보안 설정</h3>
        
        <div class="info-group">
            <label>이메일 계정</label>
            <input type="text" id="userEmail" disabled>
        </div>

        <div class="info-group">
            <label>비밀번호 재설정</label>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">
                비밀번호를 변경하려면 아래 버튼을 누르세요. 등록된 이메일로 재설정 링크가 발송됩니다.
            </p>
            <button class="btn-pw-reset" onclick="resetPassword()">비밀번호 재설정 메일 보내기</button>
        </div>

        <div class="danger-zone">
            <p>계정을 삭제하면 모든 활동 정보가 초기화됩니다.</p>
            <button class="btn-withdraw" onclick="deleteAccount()">회원 탈퇴하기</button>
        </div>
    </div>
</div>

<footer>© DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// 1. 초기 데이터 로드 및 실시간 동기화
auth.onAuthStateChanged(user => {
    const status = document.getElementById("userStatus");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const emailInput = document.getElementById("userEmail");
    const nameInput = document.getElementById("userName");

    if (user) {
        emailInput.value = user.email || "이메일 정보 없음";
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");

        // DB에서 이름 실시간 동기화 (탈퇴 시 이 연결을 끊어줘야 함)
        db.ref('users/' + user.uid).on('value', (snapshot) => {
            const data = snapshot.val();
            let finalName = (data && data.name) ? data.name : 
                            (user.displayName ? user.displayName : user.email.split('@')[0]);

            nameInput.value = finalName;
            status.innerText = `${finalName}님`;
        });
    } else {
        alert("로그인이 필요합니다.");
        location.href = "login.html";
    }
});

// 2. 이름 변경 함수 (UID 필드 추가 저장)
function updateProfile() {
    const user = auth.currentUser;
    const newName = document.getElementById("userName").value.trim();

    if (!user) return;
    if (!newName) return alert("이름을 입력해주세요.");

    // 보안 규칙 준수를 위해 name과 uid를 함께 저장합니다.
    db.ref('users/' + user.uid).update({
        name: newName,
        uid: user.uid 
    }).then(() => {
        return user.updateProfile({ displayName: newName });
    }).then(() => {
        alert("이름이 성공적으로 변경되었습니다.");
    }).catch(err => {
        alert("변경 실패: " + err.message);
    });
}

// 3. 비밀번호 재설정 메일 발송
function resetPassword() {
    const user = auth.currentUser;
    if (!user) return;

    if (confirm(`${user.email} 계정으로 비밀번호 재설정 메일을 보내시겠습니까?`)) {
        auth.sendPasswordResetEmail(user.email)
            .then(() => {
                alert("비밀번호 재설정 메일이 발송되었습니다. 메일함을 확인해주세요!");
            })
            .catch(err => {
                alert("발송 실패: " + err.message);
            });
    }
}

// 4. 회원 탈퇴 (DB 삭제 -> 계정 삭제 순서)
function deleteAccount() {
    const user = auth.currentUser;
    if (!user) return;

    if (!confirm("정말로 탈퇴하시겠습니까? 모든 활동 데이터가 영구 삭제되며 복구할 수 없습니다.")) {
        return;
    }

    const uid = user.uid;

    // [중요] 탈퇴 전 실시간 DB 감시(on)를 먼저 해제합니다.
    db.ref('users/' + uid).off();

    // 1단계: Realtime Database에서 사용자 노드 삭제
    db.ref('users/' + uid).remove()
        .then(() => {
            console.log("Database record deleted.");
            // 2단계: Firebase Authentication에서 계정 삭제
            return user.delete();
        })
        .then(() => {
            alert("회원 탈퇴가 정상적으로 완료되었습니다. 이용해 주셔서 감사합니다.");
            location.href = "index.html";
        })
        .catch(err => {
            // 최근에 로그인하지 않은 경우 발생하는 보안 에러 처리
            if (err.code === 'auth/requires-recent-login') {
                alert("보안을 위해 다시 로그인한 직후에만 탈퇴가 가능합니다. 다시 로그인해주세요.");
                auth.signOut().then(() => { location.href = 'login.html'; });
            } else {
                alert("탈퇴 오류: " + err.message);
            }
        });
}

// 5. 로그아웃
function logout() {
    if(confirm("로그아웃 하시겠습니까?")) {
        auth.signOut().then(() => {
            location.href = "index.html";
        });
    }
}
</script>
</body>
</html>
