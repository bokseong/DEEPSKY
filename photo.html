  <header class="page-hero">

    <main class="photo-main">
      <section id="photo-form-section" class="photo-form-card" hidden>
      <div>
        <p class="photo-eyebrow">새 기록</p><h2>활동 사진 등록</h2>
      </div>
      <form id="photo-form">
        <label>제목<input id="photo-title" maxlength="200" required placeholder="활동 제목을 입력하세요"></label>
        <label>설명<textarea id="photo-content" maxlength="5000" rows="4" placeholder="관측 대상, 장소와 활동 내용을 기록해 주세요."></textarea></label>
        <label>사진 <span>최대 10장</span><input id="photo-images" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple required></label>
        <div id="photo-selection" class="photo-selection" aria-live="polite"></div>
        <p id="photo-form-status" class="photo-form-status" role="status"></p>
        <button id="photo-submit" class="photo-submit" type="submit">사진 게시하기</button>
      </form>
    </section>
    <section class="photo-board" aria-labelledby="photo-board-title">
      <div class="photo-board-heading">
        <div>
          <p class="photo-eyebrow">활동 기록</p>
          <h2 id="photo-board-title">사진 게시판</h2>
        </div>
        <label class="photo-search">
          <span class="sr-only">사진 검색</span>
          <input id="photo-search" type="search" placeholder="제목, 설명 또는 작성자 검색">
        </label>
      </div>
      <p id="photo-board-status" class="photo-board-status" role="status">사진을 불러오는 중입니다.</p>
      <div id="photo-grid" class="photo-grid"></div>
    </section>
  </main>
  <dialog id="photo-dialog" class="photo-dialog">
    <button id="photo-dialog-close" class="photo-dialog-close" type="button" aria-label="닫기">×</button>
    <button id="photo-dialog-prev" class="photo-dialog-nav photo-dialog-prev" type="button" aria-label="이전 사진">‹</button>
    <img id="photo-dialog-image" alt="확대 사진">
    <button id="photo-dialog-next" class="photo-dialog-nav photo-dialog-next" type="button" aria-label="다음 사진">›</button>
    <p id="photo-dialog-caption"></p>
  </dialog>
