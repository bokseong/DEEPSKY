<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글쓰기 - DEEP SKY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", sans-serif; background: #0b0f2b; color: white; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .write-card { background: #161b4a; padding: 30px; border-radius: 15px; border: 1px solid #2d367a; }
        input[type="text"], textarea { width: 100%; padding: 15px; margin-bottom: 20px; background: #0b0f2b; border: 1px solid #1b2f80; color: white; border-radius: 8px; outline: none; }
        textarea { height: 300px; resize: none; }
        .file-input-group { margin-bottom: 20px; padding: 15px; border: 1px dashed #3a5aff; border-radius: 8px; }
        .btn-submit { width: 100%; padding: 15px; background: #3a5aff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-submit:disabled { background: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:#7fc7ff;">새 글 작성</h2>
    <div class="write-card">
        <input type="text" id="postTitle" placeholder="제목을 입력하세요">
        
        <div class="file-input-group">
            <label style="display:block; font-size:14px; color:#7fc7ff; margin-bottom:10px;">파일 첨부 (선택)</label>
            <input type="file" id="postFile">
        </div>

        <textarea id="postContent" placeholder="내용을 입력하세요..."></textarea>
        <button class="btn-submit" id="submitBtn" onclick="submitPost()">등록하기</button>
        <button onclick="history.back()" style="width:100%; background:none; border:none; color:#888; margin-top:15px; cursor:pointer;">취소</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = { /* 위와 동일 */ };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();
const auth = firebase.auth();

async function submitPost() {
    const title = document.getElementById("postTitle").value.trim();
    const content = document.getElementById("postContent").value.trim();
    const fileInput = document.getElementById("postFile");
    const user = auth.currentUser;
    const btn = document.getElementById("submitBtn");

    if(!user) return alert("로그인이 필요합니다.");
    if(!title || !content) return alert("내용을 입력해주세요.");

    btn.disabled = true;
    btn.innerText = "업로드 중...";

    let fileUrl = "";
    let fileName = "";

    try {
        if(fileInput.files.length > 0) {
            const file = fileInput.files[0];
            fileName = file.name;
            const storageRef = storage.ref(`freeboard/${Date.now()}_${fileName}`);
            await storageRef.put(file);
            fileUrl = await storageRef.getDownloadURL();
        }

        await db.ref("freeboard").push({
            title, content, fileUrl, fileName,
            author: user.displayName || user.email.split('@')[0],
            uid: user.uid,
            createdAt: firebase.database.ServerValue.TIMESTAMP
        });

        location.href = "board.html";
    } catch (e) {
        alert("업로드 실패: " + e.message);
        btn.disabled = false;
        btn.innerText = "등록하기";
    }
}
</script>
</body>
</html>
