<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - DEEP SKY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", -apple-system, sans-serif; background: #0b0f2b; color: white; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px 100px; }
        
        .write-card { background: #161b4a; padding: 30px; border-radius: 15px; border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .write-card h2 { color: #7fc7ff; margin-top: 0; margin-bottom: 25px; text-align: center; }

        label { display: block; margin-bottom: 8px; font-size: 14px; color: #7fc7ff; font-weight: bold; }
        input[type="text"], textarea { 
            width: 100%; padding: 15px; margin-bottom: 20px; background: #0b0f2b; 
            border: 1px solid #1b2f80; color: white; border-radius: 10px; outline: none; transition: 0.3s;
        }
        input:focus, textarea:focus { border-color: #3a5aff; box-shadow: 0 0 10px rgba(58,90,255,0.2); }
        
        .link-group { background: rgba(58, 90, 255, 0.05); padding: 20px; border-radius: 10px; border: 1px dashed #2d367a; margin-bottom: 20px; }
        textarea { height: 350px; resize: none; line-height: 1.6; }

        .btn-area { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-submit { padding: 18px; background: #3a5aff; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-submit:hover { background: #2a47d6; }
        .btn-cancel { padding: 18px; background: #444; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" style="text-decoration:none; color:white; font-weight:bold; font-size:20px; letter-spacing:1px;">DEEP SKY</a>
    <span id="userStatus" style="font-size:14px; color:#aaa;">로그인 확인 중...</span>
</div>

<div class="container">
    <div class="write-card">
        <h2>새 게시글 작성</h2>
        
        <label>제목</label>
        <input type="text" id="postTitle" placeholder="제목을 입력하세요">

        <div class="link-group">
            <label>파일/링크 공유 (선택)</label>
            <input type="text" id="postFileUrl" placeholder="공유할 링크 주소 (예: 구글 드라이브 링크)">
            <input type="text" id="postFileName" placeholder="링크 버튼 이름 (예: 활동 계획서 다운로드)" style="margin-bottom:0;">
        </div>

        <label>본문 내용</label>
        <textarea id="postContent" placeholder="내용을 자유롭게 입력하세요..."></textarea>

        <div class="btn-area">
            <button class="btn-submit" onclick="submitPost()">게시글 등록</button>
            <a href="board.html" class="btn-cancel">취소</a>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUserName = "";

auth.onAuthStateChanged(user => {
    if (user) {
        db.ref('users/' + user.uid + '/name').once('value', snap => {
            currentUserName = snap.val() || user.email.split('@')[0];
            document.getElementById("userStatus").innerText = currentUserName + "님";
        });
    } else {
        alert("로그인이 필요합니다.");
        location.href = "login.html";
    }
});

function submitPost() {
    const title = document.getElementById("postTitle").value.trim();
    const content = document.getElementById("postContent").value.trim();
    const fileUrl = document.getElementById("postFileUrl").value.trim();
    const fileName = document.getElementById("postFileName").value.trim();
    const user = auth.currentUser;

    if(!title || !content) return alert("제목과 내용을 모두 입력해주세요.");

    db.ref("freeboard").push({
        title, 
        content, 
        fileUrl, 
        fileName: fileName || "공유 링크 열기",
        author: currentUserName,
        uid: user.uid,
        email: user.email,
        createdAt: firebase.database.ServerValue.TIMESTAMP
    })
    .then(() => {
        alert("성공적으로 등록되었습니다!");
        location.href = "board.html";
    })
    .catch(err => alert("오류: " + err.message));
}
</script>
</body>
</html>
