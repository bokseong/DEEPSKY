<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>DEEP SKY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", "Segoe UI", sans-serif; background: #0b0f2b; color: white; }
        .hidden { display: none !important; }

        /* 상단 바 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 40px; height: 40px; margin-right: 12px; border-radius: 50%; }
        .logo-area span { font-size: 20px; font-weight: bold; }
        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button { padding: 7px 16px; border-radius: 5px; border: none; background: #3a5aff; color: white; cursor: pointer; font-weight: bold; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px 100px; }
        .write-card { background: #161b4a; padding: 30px; border-radius: 15px; border: 1px solid #2d367a; }
        
        input[type="text"], textarea { 
            width: 100%; padding: 15px; margin-bottom: 20px; 
            background: #0b0f2b; border: 1px solid #1b2f80; color: white; border-radius: 10px; outline: none; font-size: 16px;
        }
        textarea { height: 350px; resize: none; line-height: 1.6; }
        
        /* 링크 입력 영역 스타일 */
        .link-input-group { margin-bottom: 25px; padding: 20px; background: rgba(58, 90, 255, 0.05); border-radius: 10px; border: 1px dashed #3a5aff; }
        label { display: block; margin-bottom: 10px; font-size: 14px; color: #7fc7ff; font-weight: bold; }
        
        .btn-submit { width: 100%; padding: 18px; background: #3a5aff; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-submit:hover { background: #2a47d6; }
        .btn-cancel { width: 100%; padding: 12px; background: transparent; color: #888; border: none; margin-top: 10px; cursor: pointer; }
        /* 방문 전(:link)과 방문 후(:visited)를 쉼표로 연결 */
        footer { 
            background: #070a1d; text-align: center; padding: 35px 20px;
            color: #888; border-top: 1px solid #1b2f80; font-size: 13px;
        }

        @media (max-width: 600px) {
            .logo-area span { font-size: 16px; }
            nav a { padding: 10px 12px; font-size: 13px; }
            header h1 { font-size: 22px; }
            .header-logo { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/40'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">접속 중...</span>
        <button id="loginBtn" class="hidden" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<div class="container">
    <h2 style="text-align:center; color:#7fc7ff; margin-bottom:30px;">새 게시글 작성</h2>
    <div class="write-card">
        <input type="text" id="postTitle" placeholder="제목을 입력하세요">
        
    <div class="link-input-group">
    <label>공유 링크 첨부 (선택)</label>
        <div id="linkContainer">
            <div class="link-item" style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" class="postFileUrl" placeholder="링크 주소 (https://...)" style="flex: 2; margin-bottom: 0;">
                <input type="text" class="postFileName" placeholder="표시될 이름" style="flex: 1; margin-bottom: 0;">
                <button type="button" onclick="addLinkField()" style="width: 40px; background: #5a7aff; color: white; border: none; border-radius: 5px; cursor: pointer;">+</button>
            </div>
        </div>
    </div>

        <textarea id="postContent" placeholder="내용을 자유롭게 입력하세요..."></textarea>
        
        <button class="btn-submit" onclick="submitPost()">게시글 등록하기</button>
        <button class="btn-cancel" onclick="history.back()">취소</button>
    </div>
</div>

<footer>
    © DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.
    <br>
    Email : leader.deepsky@gmail.com &nbsp;	&nbsp; &nbsp; &nbsp;|	&nbsp; &nbsp; &nbsp; &nbsp;Designed by jw-astro09
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>

<script>
// 1. Firebase 초기화
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

// App Check 활성화
const appCheck = firebase.appCheck();
appCheck.activate('6Leol8MsAAAAAJcS-pWEjPLZu4alKMIxiYYiDJI0', true);

// 전역 변수
const urlParams = new URLSearchParams(window.location.search);
const editPostId = urlParams.get('id');
let currentUserName = "익명";
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

// [추가] 등급 명칭 변환 함수
function getRoleName(role) {
    switch(role) {
        case 'admin': return '관리자';
        case 'student': return '동아리 부원';
        default: return '일반 회원';
    }
}

// 2. 인증 상태 확인 및 데이터 로드 통합 (등급 표시 로직 추가)
auth.onAuthStateChanged(async (user) => {
    const statusText = document.getElementById("userStatus");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    if (user) {
        console.log("인증 성공:", user.email);
        
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");

        try {
            await appCheck.getToken();
        } catch (e) {
            console.warn("App Check 인증 지연 중...");
        }

        // [수정] 유저 이름 및 등급 실시간 로드
        db.ref("users/" + user.uid).on("value", (snap) => {
            const userData = snap.val() || {};
            currentUserName = userData.name || user.displayName || user.email.split('@')[0];
            const role = (user.email === ADMIN_EMAIL) ? 'admin' : (userData.role || 'member');
            
            statusText.innerText = `${currentUserName}님 (${getRoleName(role)})`;
        });

        if (editPostId) {
            loadEditData(user);
        }
    } else {
        console.log("인증 정보 로딩 중...");
        setTimeout(() => {
            if (!auth.currentUser) {
                alert("로그인 세션이 만료되었습니다. 다시 로그인해주세요.");
                location.href = "login.html";
            }
        }, 2000);
    }
});

// 3. 수정 데이터 로드 함수
async function loadEditData(user) {
    const titleHeader = document.querySelector("h2");
    const submitBtn = document.querySelector(".btn-submit");

    titleHeader.innerText = "게시글 수정하기";
    submitBtn.innerText = "수정 완료";

    db.ref("freeboard/" + editPostId).once("value").then(snapshot => {
        const data = snapshot.val();
        if (!data) {
            alert("게시글을 찾을 수 없거나 이미 삭제되었습니다.");
            location.href = "board.html";
            return;
        }
        
        if (data.uid !== user.uid && user.email !== ADMIN_EMAIL) {
            alert("본인이 작성한 글만 수정할 수 있습니다.");
            location.href = `view.html?id=${editPostId}`;
            return;
        }

        document.getElementById("postTitle").value = data.title || "";
        document.getElementById("postContent").value = data.content || "";

        const container = document.getElementById("linkContainer");
        if (data.links && data.links.length > 0) {
            container.innerHTML = ""; 
            data.links.forEach((link, index) => {
                addLinkField(); 
                const urlInputs = document.querySelectorAll(".postFileUrl");
                const nameInputs = document.querySelectorAll(".postFileName");
                urlInputs[index].value = link.url;
                nameInputs[index].value = link.name;
            });
            const firstItem = container.firstElementChild;
            const btn = firstItem.querySelector("button");
            btn.innerText = "+";
            btn.style.background = "#5a7aff";
            btn.onclick = addLinkField;
        } else if (data.fileUrl) {
            document.querySelector(".postFileUrl").value = data.fileUrl;
            document.querySelector(".postFileName").value = data.fileName || "";
        }
    });
}

// 4. 게시글 등록/수정 실행
async function submitPost() {
    const title = document.getElementById("postTitle").value.trim();
    const content = document.getElementById("postContent").value.trim();
    if(!title || !content) return alert("제목과 내용을 모두 입력해주세요.");

    const submitBtn = document.querySelector(".btn-submit");
    submitBtn.disabled = true;
    submitBtn.innerText = "처리 중...";

    try {
        await appCheck.getToken();

        const urlInputs = document.querySelectorAll(".postFileUrl");
        const nameInputs = document.querySelectorAll(".postFileName");
        let links = [];

        urlInputs.forEach((input, index) => {
            let url = input.value.trim();
            if (url) {
                if (!url.startsWith('http')) url = 'https://' + url;
                links.push({ 
                    url: url, 
                    name: nameInputs[index].value.trim() || "첨부 링크" 
                });
            }
        });

        const postData = {
            title: title,
            content: content,
            links: links,
            author: currentUserName,
            uid: auth.currentUser.uid,
            updatedAt: firebase.database.ServerValue.TIMESTAMP 
        };

        if (editPostId) {
            await db.ref("freeboard/" + editPostId).update(postData);
            alert("게시글이 성공적으로 수정되었습니다.");
            location.href = `view.html?id=${editPostId}`;
        } else {
            postData.createdAt = firebase.database.ServerValue.TIMESTAMP;
            await db.ref("freeboard").push(postData);
            alert("게시글이 등록되었습니다.");
            location.href = "board.html";
        }
    } catch (err) {
        alert("저장 실패: " + err.message);
        submitBtn.disabled = false;
        submitBtn.innerText = editPostId ? "수정 완료" : "게시글 등록하기";
    }
}

function addLinkField() {
    const container = document.getElementById("linkContainer");
    const div = document.createElement("div");
    div.className = "link-item";
    div.style = "display: flex; gap: 10px; margin-bottom: 10px;";
    div.innerHTML = `
        <input type="text" class="postFileUrl" placeholder="링크 주소 (https://...)" style="flex: 2; margin-bottom: 0;">
        <input type="text" class="postFileName" placeholder="표시될 이름" style="flex: 1; margin-bottom: 0;">
        <button type="button" onclick="this.parentElement.remove()" style="width: 40px; background: #ff4d4d; color: white; border: none; border-radius: 5px; cursor: pointer;">-</button>
    `;
    container.appendChild(div);
}

function logout() { if(confirm("로그아웃 하시겠습니까?")) auth.signOut().then(() => location.href = "index.html"); }
</script>
</body>
</html>
