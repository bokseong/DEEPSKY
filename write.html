<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - DEEP SKY</title>
    <style>
        /* board.html 스타일과 동일하게 로고 스타일 고정 */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", sans-serif; background: #0b0f2b; color: white; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 60px; position: sticky; top: 0; }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }
        nav { background: #11153a; border-bottom: 1px solid #2d367a; padding: 10px 0; }
        .nav-inner { max-width: 1000px; margin: 0 auto; display: flex; justify-content: center; gap: 5px; }
        nav a { color: white; padding: 12px 18px; text-decoration: none; font-weight: bold; border-radius: 8px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .intro-card { background: #161b4a; padding: 40px; border-radius: 20px; border: 1px solid #2d367a; }
        .intro-card h2 { color: #7fc7ff; border-left: 5px solid #3a5aff; padding-left: 15px; margin-bottom: 25px; }
        
        input, textarea { width: 100%; padding: 15px; margin-bottom: 15px; background: #0b0f2b; border: 1px solid #1b2f80; color: white; border-radius: 10px; outline: none; }
        .link-box { background: rgba(58, 90, 255, 0.05); padding: 15px; border-radius: 10px; border: 1px dashed #3a5aff; margin-bottom: 20px; }
        .btn-submit { width: 100%; padding: 15px; background: #3a5aff; border: none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
<div class="top-bar">
    <a href="index.html" class="logo-area"><img src="logo.png"><span>DEEP SKY</span></a>
</div>
<header><h1>글쓰기</h1></header>
<nav><div class="nav-inner"><a href="board.html">돌아가기</a></div></nav>
<div class="container">
    <div class="intro-card">
        <h2>WRITE POST</h2>
        <input type="text" id="postTitle" placeholder="제목">
        <div class="link-box">
            <input type="text" id="postFileUrl" placeholder="공유 링크 (구글드라이브 등)" style="margin-bottom:10px;">
            <input type="text" id="postFileName" placeholder="링크 버튼 이름" style="margin-bottom:0;">
        </div>
        <textarea id="postContent" style="height:300px;" placeholder="내용을 입력하세요..."></textarea>
        <button class="btn-submit" onclick="submitPost()">게시글 등록</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = { 
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"    
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    function submitPost() {
        const title = document.getElementById("postTitle").value.trim();
        const content = document.getElementById("postContent").value.trim();
        const fileUrl = document.getElementById("postFileUrl").value.trim();
        const fileName = document.getElementById("postFileName").value.trim();
        const user = auth.currentUser;
        if(!title || !content) return alert("내용을 입력하세요.");
        db.ref("freeboard").push({
            title, content, fileUrl, fileName: fileName || "공유 링크",
            author: user.email.split('@')[0], uid: user.uid,
            createdAt: firebase.database.ServerValue.TIMESTAMP
        }).then(() => location.href="board.html");
    }
</script>
</body>
</html>
