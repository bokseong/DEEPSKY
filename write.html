<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - DEEP SKY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", sans-serif; background: #0b0f2b; color: white; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .write-card { background: #161b4a; padding: 30px; border-radius: 15px; border: 1px solid #2d367a; }
        input, textarea { width: 100%; padding: 15px; margin-bottom: 20px; background: #0b0f2b; border: 1px solid #1b2f80; color: white; border-radius: 10px; outline: none; }
        textarea { height: 350px; resize: none; }
        .btn-submit { width: 100%; padding: 18px; background: #3a5aff; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" style="text-decoration:none; color:white; font-weight:bold;">DEEP SKY</a>
    <span id="userStatus" style="font-size:14px;">확인 중...</span>
</div>

<div class="container">
    <h2 style="text-align:center; color:#7fc7ff;">새 게시글 작성</h2>
    <div class="write-card">
        <input type="text" id="postTitle" placeholder="제목을 입력하세요">
        <textarea id="postContent" placeholder="내용을 자유롭게 입력하세요..."></textarea>
        <button class="btn-submit" onclick="submitPost()">게시글 등록하기</button>
        <button onclick="history.back()" style="width:100%; background:none; border:none; color:#888; margin-top:10px; cursor:pointer;">취소</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUserName = "";

auth.onAuthStateChanged(user => {
    if (user) {
        db.ref('users/' + user.uid + '/name').once('value', snap => {
            currentUserName = snap.val() || user.email.split('@')[0];
            document.getElementById("userStatus").innerText = currentUserName + "님 작성 중";
        });
    } else {
        alert("로그인이 필요합니다.");
        location.href = "login.html";
    }
});

function submitPost() {
    const title = document.getElementById("postTitle").value.trim();
    const content = document.getElementById("postContent").value.trim();
    const user = auth.currentUser;

    if(!title || !content) return alert("제목과 내용을 입력해주세요.");
    if(!user) return alert("로그인 정보가 없습니다.");

    // 🚨 핵심: push 시 uid를 명확히 포함해야 규칙을 통과함
    db.ref("freeboard").push({
        title: title,
        content: content,
        author: currentUserName,
        uid: user.uid,
        email: user.email,
        createdAt: firebase.database.ServerValue.TIMESTAMP
    })
    .then(() => {
        alert("등록되었습니다!");
        location.href = "board.html"; // 성공 시 이동
    })
    .catch(err => {
        alert("오류 발생: " + err.message);
    });
}
</script>
</body>
</html>
