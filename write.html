<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - DEEP SKY</title>
    <style>
        /* 1. 공통 스타일 및 초기화 (제공해주신 템플릿 유지) */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", AppleSDGothicNeo-Regular, sans-serif; background: #0b0f2b; color: white; line-height: 1.8; }
        .hidden { display: none !important; }

        /* 2. 상단 바 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 60px; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        .logo-area span { font-size: 18px; font-weight: bold; letter-spacing: -0.5px; }
        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button { padding: 5px 12px; border-radius: 5px; border: none; background: #3a5aff; color: white; cursor: pointer; font-weight: bold; }

        /* 3. 헤더 및 내비게이션 */
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }
        nav { background: #11153a; border-bottom: 1px solid #2d367a; padding: 10px 0; }
        .nav-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        nav a { display: inline-block; color: white; padding: 12px 18px; text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 8px; }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 4. 본문 스타일 */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px 100px; }
        .write-card { background: #161b4a; padding: 40px; border-radius: 20px; border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .write-card h2 { color: #7fc7ff; border-left: 5px solid #3a5aff; padding-left: 15px; margin-bottom: 25px; font-size: 24px; }

        label { display: block; margin-bottom: 8px; font-size: 14px; color: #7fc7ff; font-weight: bold; }
        input[type="text"], textarea { 
            width: 100%; padding: 15px; margin-bottom: 20px; background: #0b0f2b; 
            border: 1px solid #1b2f80; color: white; border-radius: 10px; outline: none; transition: 0.3s;
        }
        input:focus, textarea:focus { border-color: #3a5aff; }
        textarea { height: 300px; resize: none; }

        .link-area { background: rgba(58, 90, 255, 0.05); padding: 20px; border-radius: 10px; border: 1px dashed #2d367a; margin-bottom: 20px; }
        
        .btn-submit { width: 100%; padding: 15px; background: #3a5aff; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        footer { background: #070a1d; text-align: center; padding: 30px 20px; font-size: 12px; color: #888; border-top: 1px solid #1b2f80; width: 100%; margin-top: 50px; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/35'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">불러오는 중...</span>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<header><h1>자유 게시판</h1></header>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html">자유 게시판</a>
        <a href="photo.html">활동 사진</a>
        <a href="resource.html">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
    </div>
</nav>

<div class="container">
    <div class="write-card">
        <h2>새 게시글 작성</h2>
        
        <label>제목</label>
        <input type="text" id="postTitle" placeholder="제목을 입력하세요">

        <div class="link-area">
            <label>🔗 외부 자료 링크 (선택)</label>
            <input type="text" id="postFileUrl" placeholder="예: 구글 드라이브, 노션 링크 등">
            <input type="text" id="postFileName" placeholder="링크 이름 (예: 실험 보고서 보러가기)" style="margin-bottom:0;">
        </div>

        <label>내용</label>
        <textarea id="postContent" placeholder="내용을 입력하세요..."></textarea>

        <button class="btn-submit" onclick="submitPost()">게시글 등록하기</button>
    </div>
</div>

<footer>© DEEP SKY | Bokseong Astronomy and Aerospace Club</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentName = "";

auth.onAuthStateChanged(user => {
    if (user) {
        db.ref('users/' + user.uid + '/name').on('value', snap => {
            currentName = snap.val() || user.email.split('@')[0];
            document.getElementById("userStatus").innerText = `${currentName}님`;
        });
        document.getElementById("logoutBtn").classList.remove("hidden");
    } else {
        alert("로그인이 필요합니다.");
        location.href = "login.html";
    }
});

function submitPost() {
    const title = document.getElementById("postTitle").value.trim();
    const content = document.getElementById("postContent").value.trim();
    const fileUrl = document.getElementById("postFileUrl").value.trim();
    const fileName = document.getElementById("postFileName").value.trim();
    const user = auth.currentUser;

    if(!title || !content) return alert("제목과 내용을 입력해주세요.");

    db.ref("freeboard").push({
        title, content, fileUrl, 
        fileName: fileName || "공유 링크",
        author: currentName,
        uid: user.uid,
        createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
        alert("등록되었습니다.");
        location.href = "board.html";
    });
}

function logout() { auth.signOut().then(() => location.reload()); }
</script>
</body>
</html>
