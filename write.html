<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>DEEP SKY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", "Segoe UI", sans-serif; background: #0b0f2b; color: white; }
        .hidden { display: none !important; }

        /* 상단 바 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 40px; height: 40px; margin-right: 12px; border-radius: 50%; }
        .logo-area span { font-size: 20px; font-weight: bold; }
        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button { padding: 7px 16px; border-radius: 5px; border: none; background: #3a5aff; color: white; cursor: pointer; font-weight: bold; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px 100px; }
        .write-card { background: #161b4a; padding: 30px; border-radius: 15px; border: 1px solid #2d367a; }
        
        input[type="text"], textarea { 
            width: 100%; padding: 15px; margin-bottom: 20px; 
            background: #0b0f2b; border: 1px solid #1b2f80; color: white; border-radius: 10px; outline: none; font-size: 16px;
        }
        textarea { height: 350px; resize: none; line-height: 1.6; }
        
        /* 링크 입력 영역 스타일 */
        .link-input-group { margin-bottom: 25px; padding: 20px; background: rgba(58, 90, 255, 0.05); border-radius: 10px; border: 1px dashed #3a5aff; }
        label { display: block; margin-bottom: 10px; font-size: 14px; color: #7fc7ff; font-weight: bold; }
        
        .btn-submit { width: 100%; padding: 18px; background: #3a5aff; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-submit:hover { background: #2a47d6; }
        .btn-cancel { width: 100%; padding: 12px; background: transparent; color: #888; border: none; margin-top: 10px; cursor: pointer; }
        /* 방문 전(:link)과 방문 후(:visited)를 쉼표로 연결 */
        footer { 
            background: #070a1d; text-align: center; padding: 35px 20px;
            color: #888; border-top: 1px solid #1b2f80; font-size: 13px;
        }

        @media (max-width: 600px) {
            .logo-area span { font-size: 16px; }
            nav a { padding: 10px 12px; font-size: 13px; }
            header h1 { font-size: 22px; }
            .header-logo { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/40'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">접속 중...</span>
        <button id="loginBtn" class="hidden" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<div class="container">
    <h2 id="pageTitle" style="text-align:center; color:#7fc7ff; margin-bottom:30px;">새 게시글 작성</h2>
    <div class="write-card">
        <input type="text" id="postTitle" placeholder="제목을 입력하세요">
        
    <div class="link-input-group">
    <label>공유 링크 첨부 (선택)</label>
        <div id="linkContainer">
            <div class="link-item" style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" class="postFileUrl" placeholder="링크 주소 (https://...)" style="flex: 2; margin-bottom: 0;">
                <input type="text" class="postFileName" placeholder="표시될 이름" style="flex: 1; margin-bottom: 0;">
                <button type="button" onclick="addLinkField()" style="width: 40px; background: #5a7aff; color: white; border: none; border-radius: 5px; cursor: pointer;">+</button>
            </div>
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:bold; color:#7fc7ff;">파일 업로드:</label>
            <input type="file" id="pFile" style="width:100%; padding:10px; background:#0b0f2b; color:white; border:1px solid #1b2f80; border-radius:8px;">
            <div id="oldFileInfo" class="hidden" style="margin-top:8px; color:#aaa; font-size:13px;"></div>
        </div>
    </div>

        <textarea id="postContent" placeholder="내용을 자유롭게 입력하세요..."></textarea>
        
        <button id="submitBtn" class="btn-submit" onclick="submitPost()">게시글 등록하기</button>
        <button class="btn-cancel" onclick="history.back()">취소</button>
    </div>
</div>

<footer>
    © DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.
    <br>
    Email : leader.deepsky@gmail.com &nbsp;	&nbsp; &nbsp; &nbsp;|	&nbsp; &nbsp; &nbsp; &nbsp;Designed by jw-astro09
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const API_BASE_URL = "https://hypocrite-depletion-until.ngrok-free.dev";
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

let currentUser = null;
let currentUserName = "익명";
let currentUserRole = "guest";
let originalPost = null;

const urlParams = new URLSearchParams(window.location.search);
const editPostId = urlParams.get("id");
const isEditMode = Boolean(editPostId);

auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    const status = document.getElementById("userStatus");
    if (user) {
        db.ref('users/' + user.uid).on('value', (snapshot) => {
            const userData = snapshot.val() || {};
            currentUserName = userData.name || user.displayName || user.email.split('@')[0];
            currentUserRole = (user.email === ADMIN_EMAIL) ? 'admin' : (userData.role || 'member');
            if (status) status.innerText = `${currentUserName}님 (${currentUserRole==='admin'?'관리자':(currentUserRole==='student'?'부원':'일반')})`;
            if (isEditMode && !originalPost) initEditPage();
        });
        document.getElementById("loginBtn")?.classList.add("hidden");
        document.getElementById("logoutBtn")?.classList.remove("hidden");
    } else {
        alert("로그인 세션이 만료되었습니다. 목록으로 복귀합니다.");
        location.href = "board.html";
    }
});

async function initEditPage() {
    document.getElementById("pageTitle").innerText = "게시글 수정";
    document.getElementById("submitBtn").innerText = "게시글 수정 완료";

    try {
        const res = await fetch(`${API_BASE_URL}/api/freeboard/${editPostId}`, {
            method: "GET",
            headers: { "ngrok-skip-browser-warning": "69420" }
        });
        if (!res.ok) throw new Error("게시글을 불러오지 못했습니다.");

        const post = await res.json();
        if (post.uid !== currentUser.uid && currentUserRole !== "admin") {
            alert("수정 권한이 없습니다.");
            location.href = "board.html";
            return;
        }

        originalPost = post;
        document.getElementById("postTitle").value = post.title || "";
        document.getElementById("postContent").value = post.content || "";
        document.querySelector(".postFileUrl").value = post.link || "";
        document.querySelector(".postFileName").value = post.linkName || "첨부 링크";

        if (post.fileUrl || post.file_path) {
            const oldFileInfo = document.getElementById("oldFileInfo");
            oldFileInfo.classList.remove("hidden");
            oldFileInfo.innerText = `현재 등록된 파일: ${post.file_name || post.fileName || "파일 존재"}`;
        }
    } catch (err) {
        alert(err.message || "게시글 정보를 불러오는 중 오류가 발생했습니다.");
        location.href = "board.html";
    }
}

async function submitPost() {
    const title = document.getElementById("postTitle").value.trim();
    const content = document.getElementById("postContent").value.trim();
    const fileInput = document.getElementById("pFile");
    const linkInput = document.querySelector(".postFileUrl");
    const linkNameInput = document.querySelector(".postFileName");
    let link = linkInput ? linkInput.value.trim() : "";
    const linkName = linkNameInput ? linkNameInput.value.trim() : "";

    if (!title || !content) return alert("제목과 내용을 입력해주세요.");
    if (!currentUser) return alert("인증 오류가 발생했습니다.");
    if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;

    try {
        const token = await currentUser.getIdToken();
        const formData = new FormData();
        formData.append("title", title);
        formData.append("content", content);
        formData.append("link", link);
        formData.append("linkName", linkName);
        formData.append("author", currentUserName);
        formData.append("email", currentUser.email);
        formData.append("uid", currentUser.uid);
        const now = new Date();
        if (!isEditMode) {
            formData.append("date", now.toISOString());
            formData.append("createdAt", now.toISOString());
            formData.append("updatedAt", now.toISOString());
            formData.append("timestamp", now.getTime());
        } else if (originalPost?.date) {
            formData.append("date", originalPost.date);
            formData.append("createdAt", originalPost.createdAt || originalPost.created_at || originalPost.date);
            formData.append("updatedAt", now.toISOString());
            formData.append("timestamp", originalPost.timestamp || getPostTime(originalPost));
        } else {
            formData.append("updatedAt", now.toISOString());
        }

        if (fileInput && fileInput.files.length > 0) {
            formData.append("file", fileInput.files[0]);
        }

        const url = isEditMode ? `${API_BASE_URL}/api/freeboard/${editPostId}` : `${API_BASE_URL}/api/freeboard`;
        const method = isEditMode ? "PUT" : "POST";
        const res = await fetch(url, {
            method,
            headers: {
                "Authorization": `Bearer ${token}`,
                "ngrok-skip-browser-warning": "69420"
            },
            body: formData
        });

        if (!res.ok) throw new Error("서버 저장 처리 실패");
        
        alert(isEditMode ? "게시글이 성공적으로 수정되었습니다." : "게시글이 성공적으로 등록되었습니다.");
        location.href = "board.html";
    } catch (err) {
        console.error(err);
        alert("저장 중 통신 오류가 발생했습니다.");
    }
}

function getPostTime(post) {
    const rawValue = post?.createdAt || post?.created_at || post?.timestamp || post?.date;
    if (!rawValue) return 0;
    if (typeof rawValue === "number") return rawValue;
    const parsed = Date.parse(rawValue);
    return Number.isNaN(parsed) ? 0 : parsed;
}

function addLinkField() {
    alert("현재 자유게시판은 공유 링크 1개만 첨부할 수 있습니다.");
}

function logout() { if(confirm("로그아웃 하시겠습니까?")) auth.signOut().then(() => location.href="board.html"); }
</script>
</body>
</html>
