<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>DEEP SKY</title>
    <style>
        /* 1. 공통 스타일 및 초기화 */
        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: "Segoe UI", AppleSDGothicNeo-Regular, sans-serif; 
            background: #0b0f2b; color: white; line-height: 1.8; 
        }

        .hidden { display: none !important; }

        /* 2. 상단 바 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80;
            height: 60px; position: sticky; top: 0; z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        .logo-area span { font-size: 18px; font-weight: bold; letter-spacing: -0.5px; }

        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button {
            padding: 5px 12px; border-radius: 5px; border: none;
            background: #3a5aff; color: white; cursor: pointer; font-weight: bold;
        }

        /* 3. 헤더 및 내비게이션 */
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }
        nav { 
    background: #11153a; 
    border-bottom: 1px solid #2d367a; 
    padding: 10px 0; 
    /* 줄바꿈을 허용하기 위해 아래 두 줄 수정/삭제 */
    overflow-x: visible; 
    white-space: normal; 
}

nav .nav-inner { 
    max-width: 1200px;
    margin: 0 auto; 
    display: flex; 
    /* wrap으로 변경하여 공간이 부족하면 아래로 넘어가게 함 */
    flex-wrap: wrap; 
    justify-content: center; 
    gap: 5px; /* 줄바꿈 시 가독성을 위해 간격을 조금 넓힘 */
}
        nav a { 
            display: inline-block; 
            color: white; 
            padding: 12px 18px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 15px; 
            border-radius: 8px;
        }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 4. 본문 컨테이너 및 폼 스타일 */
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px 100px; }
        
        .intro-card { 
            background: #161b4a; padding: 40px; border-radius: 20px; 
            border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .intro-card h2 { 
            color: #7fc7ff; border-left: 5px solid #3a5aff; 
            padding-left: 15px; margin-bottom: 25px; font-size: 24px; 
        }

        .form-group { margin-bottom: 25px; }
        .form-group label { 
            display: block; margin-bottom: 8px; color: #7fc7ff; 
            font-weight: bold; font-size: 15px; 
        }

        select, textarea {
            width: 100%; background: #0b0f2b; color: white; border: 1px solid #3a5aff; 
            padding: 12px; border-radius: 10px; outline: none; font-family: inherit; font-size: 15px;
        }

        textarea { height: 180px; resize: none; line-height: 1.6; }
        textarea::placeholder { color: #555; }

        .btn-submit {
            width: 100%; background: #28a745; color: white; border: none; padding: 15px;
            border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #218838; transform: translateY(-2px); }
        .btn-submit:disabled { background: #555; cursor: not-allowed; transform: none; }

        footer { background: #070a1d; text-align: center; padding: 30px 20px; font-size: 12px; color: #888; border-top: 1px solid #1b2f80; width: 100%; margin-top: 50px; }
        
        @media (max-width: 600px) {
            .logo-area span { font-size: 16px; }
            nav a { padding: 10px 12px; font-size: 13px; }
            header h1 { font-size: 22px; }
            .intro-card { padding: 25px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/35'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">불러오는 중...</span>
        <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<header><h1>등급 조정 신청</h1></header>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html">자유 게시판</a>
        <a href="photo.html">활동 사진</a>
        <a href="resource.html">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
        <a href="suggest.html">건의함</a>
        <a href="admin.html">ADMIN</a>
        <a href="block.html">등급 조정 요청</a>
        <a href="https://hq-syrtn.github.io/SYRTN/index.html">SYRTN</a>
    </div>
</nav>

<div class="container">
    <div class="intro-card">
        <h2>권한 요청 작성</h2>
        <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 30px;">
            * 신청하신 내용은 관리자 메일로 전송되며, 확인 후 등급이 조정됩니다.
        </p>

        <div class="form-group">
            <label for="requestedRole">희망 등급</label>
            <select id="requestedRole">
                <option value="admin">관리자</option>
                <option value="student">동아리 부원</option>
                <option value="member">일반 회원</option>
            </select>
        </div>

        <div class="form-group">
            <label for="requestReason">조정 사유</label>
            <textarea id="requestReason" placeholder="상세한 사유를 적어주세요.&#10;예: 신입 부원 OOO입니다. 동아리 활동을 위해 권한 상향을 요청합니다."></textarea>
        </div>

        <button id="submitBtn" class="btn-submit" onclick="sendRequestEmail()">등급 조정 요청 보내기</button>
    </div>
</div>

<footer>
    © DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.
    <br>
    Email : leader.deepsky@gmail.com &nbsp; | &nbsp; Designed by jw-astro09
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>

<script>
    // 1. Firebase 설정
    const firebaseConfig = {
        apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
        authDomain: "bokseong-deep-sky.firebaseapp.com",
        databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bokseong-deep-sky",
        storageBucket: "bokseong-deep-sky.firebasestorage.app",
        messagingSenderId: "800777151311",
        appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
    };

    // 2. 초기화
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const API_BASE_URL = "https://hypocrite-depletion-until.ngrok-free.dev";
    const appCheck = firebase.appCheck();
    appCheck.activate('6Leol8MsAAAAAJcS-pWEjPLZu4alKMIxiYYiDJI0', true);

    const ADMIN_EMAIL = "leader.deepsky@gmail.com";

   // 3. 인증 상태 관리
    auth.onAuthStateChanged((user) => {
        const status = document.getElementById("userStatus");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const mainContainer = document.getElementById("mainContainer");

        if (user) {
            // [로그인 상태] 컨테이너를 보여주고 유저 정보 로드
            if (mainContainer) mainContainer.classList.remove("hidden");

            db.ref('users/' + user.uid).on('value', (snapshot) => {
                const userData = snapshot.val() || {};
                const finalName = userData.name || user.displayName || user.email.split('@')[0];
                let userRole = (user.email === ADMIN_EMAIL) ? 'admin' : (userData.role || 'member');
                
                if (status) status.innerText = `${finalName}님 (${getRoleName(userRole)})`;
            });

            loginBtn?.classList.add("hidden");
            logoutBtn?.classList.remove("hidden");
        } else {
            // [비로그인 상태] 경고 없이 즉시 로그인 페이지로 리다이렉트
            location.href = 'login.html';
        }
    });
    
    function getRoleName(role) {
        if (role === 'admin') return '관리자';
        if (role === 'student') return '동아리 부원';
        return '일반 회원';
    }

    async function sendRequestEmail() {
        const user = auth.currentUser;
        const roleElement = document.getElementById("requestedRole");
        const reasonElement = document.getElementById("requestReason");
        const btn = document.getElementById("submitBtn");

        if (!user) {
            alert("로그인 후 요청이 가능합니다.");
            return;
        }

        const requestedRoleName = roleElement.options[roleElement.selectedIndex].text;
        const reasonValue = reasonElement.value.trim();

        if (!reasonValue) {
            alert("조정 사유를 입력해주세요.");
            reasonElement.focus();
            return;
        }

        if (confirm(`[${requestedRoleName}] 등급으로 조정을 요청하시겠습니까?`)) {
            btn.disabled = true;
            btn.innerText = "전송 중...";

            try {
                const token = await user.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/role-requests`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`,
                        "ngrok-skip-browser-warning": "69420"
                    },
                    body: JSON.stringify({
                    requestedRole: roleElement.value,
                    reason: reasonValue,
                    date: new Date().toISOString()
                    })
                });
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || "등급 요청 실패");
                }

                alert("성공적으로 요청을 보냈습니다. 관리자 확인을 기다려주세요.");
                reasonElement.value = "";
            } catch (error) {
                console.error("Error:", error);
                alert("전송 중 오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.innerText = "등급 조정 요청 보내기";
            }
        }
    }

    window.logout = () => {
        if (confirm("로그아웃 하시겠습니까?")) {
            auth.signOut().then(() => {
                alert("로그아웃 되었습니다.");
                location.href = 'index.html';
            });
        }
    };
</script>
</body>
</html>
