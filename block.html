        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>

</div>

<nav aria-label="주요 메뉴">

</nav>

<div class="container">
    <div class="intro-card">
        <h2>권한 요청 작성</h2>
        <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 30px;">
            * 신청하신 내용은 관리자 메일로 전송되며, 확인 후 등급이 조정됩니다.
        </p>

        <div class="form-group">
            <label for="requestedRole">희망 등급</label>
            <select id="requestedRole" aria-label="요청할 등급">
                <option value="admin">관리자</option>
                <option value="student">동아리 부원</option>
                <option value="member">일반 회원</option>
            </select>
        </div>

        <div class="form-group">
            <label for="requestReason">조정 사유</label>
            <textarea id="requestReason" aria-label="등급 조정 요청 사유" placeholder="상세한 사유를 적어주세요.&#10;예: 신입 부원 OOO입니다. 동아리 활동을 위해 권한 상향을 요청합니다."></textarea>
        </div>

        <button id="submitBtn" class="btn-submit" onclick="sendRequestEmail()">등급 조정 요청 보내기</button>
    </div>
</div>
