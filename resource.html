<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료실 - DEEP SKY</title>
    <style>
        /* 1. 공통 스타일 (인덱스 계승) */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", "Segoe UI", sans-serif; background: #0b0f2b; color: white; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* 상단 바 & 내비게이션 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 40px; height: 40px; margin-right: 12px; border-radius: 50%; }
        .logo-area span { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button { padding: 7px 16px; border-radius: 5px; border: none; background: #3a5aff; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .auth-bar button:hover { background: #2a47d6; }
        
        nav { background: #11153a; border-bottom: 1px solid #2d367a; padding: 10px 0; }
        nav .nav-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        nav a { display: inline-block; color: white; padding: 12px 18px; text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 8px; transition: 0.2s; }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 2. 자료실 전용 디자인 */
        .container { max-width: 1000px; margin: 35px auto; padding: 0 20px 100px; }
        .page-header { margin-bottom: 30px; text-align: center; }
        .page-header h2 { color: #7fc7ff; font-size: 28px; margin-bottom: 10px; }

        /* 검색창 스타일 */
        .search-box { margin-bottom: 30px; position: relative; }
        .search-box input { width: 100%; padding: 15px 20px; border-radius: 12px; border: 1px solid #1b2f80; background: #161b4a; color: white; font-size: 16px; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: #3a5aff; box-shadow: 0 0 10px rgba(58, 90, 255, 0.3); }

        /* 관리자 업로드 카드 */
        .upload-card { background: linear-gradient(145deg, #1c235a, #161b4a); padding: 25px; border-radius: 15px; border: 1px solid #3a5aff; margin-bottom: 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .upload-card h3 { margin-top: 0; color: #7fc7ff; font-size: 18px; margin-bottom: 15px; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .upload-card input { padding: 12px; background: #0b0f2b; border: 1px solid #1b2f80; color: white; border-radius: 8px; font-size: 14px; }
        .btn-upload { width: 100%; padding: 12px; background: #3a5aff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* 자료 리스트 레이아웃 */
        .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .resource-card { background: #161b4a; padding: 25px; border-radius: 15px; border: 1px solid #2d367a; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
        .resource-card:hover { transform: translateY(-5px); border-color: #3a5aff; background: #1c235a; }
        .res-title { font-size: 19px; font-weight: bold; color: #7fc7ff; margin-bottom: 10px; }
        .res-desc { font-size: 14px; color: #ccc; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; }
        
        .card-buttons { display: flex; gap: 8px; }
        .btn-down { flex: 2; padding: 10px; background: #3a5aff; color: white; text-align: center; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .btn-del { flex: 1; padding: 10px; background: #ff4d4d; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }

        /* 비로그인 안내 */
        #loginMsg { text-align: center; padding: 80px 20px; background: rgba(22, 27, 74, 0.5); border-radius: 20px; border: 1px dashed #2d367a; }
        
        footer { background: #070a1d; text-align: center; padding: 35px 20px; color: #888; border-top: 1px solid #1b2f80; font-size: 13px; margin-top: 50px; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/40'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">확인 중...</span>
        <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html">자유 게시판</a>
        <a href="photo.html">활동 사진</a>
        <a href="resource.html" style="color: #7fc7ff; background: rgba(127, 199, 255, 0.1);">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h2>학습 자료실</h2>
        <p style="color:#aaa;">동아리 활동에 필요한 유용한 자료들을 다운로드하세요.</p>
    </div>

    <div id="loginMsg" class="hidden">
        <h3 style="color:#ff4d4d;">로그인 필요</h3>
        <p>자료실은 동아리 회원만 이용할 수 있습니다.</p>
        <button onclick="location.href='login.html'" style="padding:10px 25px; background:#3a5aff; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">로그인하기</button>
    </div>

    <div id="mainContent" class="hidden">
        
        <div class="search-box">
            <input type="text" id="resSearch" onkeyup="filterResources()" placeholder="찾으시는 자료의 제목을 입력하세요...">
        </div>

        <div id="adminUpload" class="upload-card hidden">
            <h3>📂 새 자료 등록 (관리자 전용)</h3>
            <div class="input-group">
                <input type="text" id="resTitle" placeholder="자료 제목">
                <input type="text" id="resLink" placeholder="다운로드 링크 (Google Drive 등)">
            </div>
            <input type="text" id="resDesc" placeholder="간략한 설명 (예: 2026년 천문학 기초 강의록)" style="width:100%; margin-bottom:10px;">
            <button class="btn-upload" onclick="uploadResource()">자료 게시하기</button>
        </div>

        <div class="resource-grid" id="resourceGrid">
            </div>
    </div>
</div>

<footer>© DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

auth.onAuthStateChanged(user => {
    const status = document.getElementById("userStatus");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const loginMsg = document.getElementById("loginMsg");
    const mainContent = document.getElementById("mainContent");
    const adminUpload = document.getElementById("adminUpload");

    if (user) {
        status.innerText = user.email.split('@')[0] + "님";
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
        loginMsg.classList.add("hidden");
        mainContent.classList.remove("hidden");

        if(user.email === ADMIN_EMAIL) adminUpload.classList.remove("hidden");
        loadResources(user);
    } else {
        status.innerText = "로그인 해주세요";
        loginBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        loginMsg.classList.remove("hidden");
        mainContent.classList.add("hidden");
    }
});

function loadResources(user) {
    db.ref("resources").on("value", snapshot => {
        renderResources(snapshot.val(), user);
    });
}

function renderResources(data, user) {
    const grid = document.getElementById("resourceGrid");
    const term = document.getElementById("resSearch").value.toLowerCase();
    grid.innerHTML = "";

    if(!data) {
        grid.innerHTML = "<p style='grid-column:1/-1; text-align:center; padding:50px; color:#888;'>등록된 자료가 없습니다.</p>";
        return;
    }

    Object.keys(data).reverse().forEach(key => {
        const item = data[key];
        if(item.title.toLowerCase().includes(term) || item.desc.toLowerCase().includes(term)) {
            const card = document.createElement("div");
            card.className = "resource-card";
            
            const delBtn = (user && user.email === ADMIN_EMAIL) 
                ? `<button class="btn-del" onclick="deleteResource('${key}')">삭제</button>` : "";

            card.innerHTML = `
                <div>
                    <div class="res-title">${item.title}</div>
                    <div class="res-desc">${item.desc}</div>
                </div>
                <div class="card-buttons">
                    <a href="${item.link}" target="_blank" class="btn-down">파일 받기</a>
                    ${delBtn}
                </div>
            `;
            grid.appendChild(card);
        }
    });
}

function filterResources() {
    db.ref("resources").once("value", snap => renderResources(snap.val(), auth.currentUser));
}

function uploadResource() {
    const title = document.getElementById("resTitle").value.trim();
    const link = document.getElementById("resLink").value.trim();
    const desc = document.getElementById("resDesc").value.trim();

    if(!title || !link) return alert("제목과 링크는 필수입니다.");

    db.ref("resources").push({
        title, link, desc,
        createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
        alert("자료가 등록되었습니다.");
        document.getElementById("resTitle").value = "";
        document.getElementById("resLink").value = "";
        document.getElementById("resDesc").value = "";
    });
}

function deleteResource(key) {
    if(confirm("이 자료를 삭제하시겠습니까?")) {
        db.ref("resources/" + key).remove();
    }
}

function logout() {
    if(confirm("로그아웃 하시겠습니까?")) {
        auth.signOut().then(() => location.reload());
    }
}
</script>
</body>
</html>
