<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료실 - DEEP SKY</title>
    <style>
        /* 1. introduce.html과 동일한 공통 스타일 */
        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: "Segoe UI", AppleSDGothicNeo-Regular, sans-serif; 
            background: #0b0f2b; color: white; line-height: 1.8; 
        }
        .hidden { display: none !important; }

        /* 2. 상단 바 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80;
            height: 60px; position: sticky; top: 0; z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        .logo-area span { font-size: 18px; font-weight: bold; letter-spacing: -0.5px; }

        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button {
            padding: 5px 12px; border-radius: 5px; border: none;
            background: #3a5aff; color: white; cursor: pointer; font-weight: bold;
        }

        /* 3. 헤더 (파란 박스) 및 내비게이션 */
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 28px; color: white; letter-spacing: 1px; }

        nav { background: #11153a; border-bottom: 1px solid #2d367a; padding: 10px 0; }
        nav .nav-inner { 
            max-width: 1000px; margin: 0 auto; display: flex; 
            flex-wrap: wrap; justify-content: center; gap: 5px; 
        }
        nav a { 
            display: inline-block; color: white; padding: 12px 18px; 
            text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 8px;
        }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 4. 본문 컨테이너 */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px 100px; }
        
        .intro-card { 
            background: #161b4a; padding: 35px; border-radius: 20px; 
            border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .intro-card h2 { 
            color: #7fc7ff; border-left: 5px solid #3a5aff; 
            padding-left: 15px; margin-bottom: 25px; font-size: 24px; 
        }

        /* 🔍 검색창 스타일 */
        .search-box {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .search-box input {
            flex: 1; padding: 12px 15px; background: #0b0f2b; 
            border: 1px solid #2d367a; color: white; border-radius: 10px;
            font-size: 14px; outline: none; transition: 0.2s;
        }
        .search-box input:focus { border-color: #3a5aff; box-shadow: 0 0 10px rgba(58, 90, 255, 0.3); }

        /* 관리자용 업로드 박스 */
        .admin-box { 
            background: rgba(58, 90, 255, 0.05); border: 1px dashed #3a5aff; 
            padding: 25px; border-radius: 15px; margin-bottom: 40px; 
        }
        .admin-box h3 { margin-top: 0; color: #7fc7ff; font-size: 18px; margin-bottom: 15px; }
        .admin-box input { 
            width: 100%; padding: 12px; margin-bottom: 10px; background: #0b0f2b; 
            border: 1px solid #1b2f80; color: white; border-radius: 8px; font-size: 14px;
        }
        .btn-main { 
            width: 100%; padding: 13px; background: #3a5aff; color: white; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;
        }
        .btn-main:hover { background: #5a7aff; }

        /* 자료 그리드 */
        .resource-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .resource-item { 
            background: rgba(255,255,255,0.05); padding: 22px; border-radius: 15px; 
            border: 1px solid rgba(58, 90, 255, 0.2); display: flex; flex-direction: column; justify-content: space-between;
            transition: 0.2s;
        }
        .resource-item:hover { transform: translateY(-3px); border-color: #3a5aff; }
        .file-name { font-weight: bold; color: #7fc7ff; font-size: 18px; margin-bottom: 8px; }
        .file-desc { font-size: 14px; color: #ccc; margin-bottom: 20px; min-height: 42px; }
        
        .btn-download { 
            display: block; text-align: center; background: #3a5aff; color: white; 
            text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px;
        }
        .btn-delete { 
            background: none; color: #ff4d4d; border: none; cursor: pointer; 
            font-size: 12px; margin-top: 12px; text-decoration: underline; text-align: center;
        }

        footer { background: #070a1d; text-align: center; padding: 30px 20px; font-size: 12px; color: #888; border-top: 1px solid #1b2f80; margin-top: 50px; }

        @media (max-width: 600px) {
            .resource-grid { grid-template-columns: 1fr; }
            header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/35'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">확인 중...</span>
        <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<header>
    <h1>자료실</h1>
</header>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html">자유 게시판</a>
        <a href="photo.html">활동 사진</a>
        <a href="resource.html">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
    </div>
</nav>

<div class="container">
    <div id="lockMessage" class="intro-card hidden" style="text-align: center;">
        <h2 style="border:none; padding:0; text-align:center;">🔒 회원 전용 공간</h2>
        <p>자료실은 DEEP SKY 회원만 접근할 수 있습니다.</p>
        <button class="btn-main" onclick="location.href='login.html'" style="width: auto; padding: 12px 40px; margin-top: 20px;">로그인하러 가기</button>
    </div>

    <div id="mainContent" class="hidden">
        <div id="adminUpload" class="admin-box hidden">
            <h3>새로운 자료 등록 (관리자)</h3>
            <input type="text" id="fileTitle" placeholder="자료 제목">
            <input type="text" id="fileDesc" placeholder="자료 설명">
            <input type="text" id="fileLink" placeholder="다운로드 링크">
            <button class="btn-main" onclick="uploadResource()">자료 게시하기</button>
        </div>

        <div class="intro-card">
            <h2>보관된 자료 목록</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="찾으시는 자료의 제목이나 설명을 입력하세요..." onkeyup="filterResources()">
            </div>

            <div class="resource-grid" id="resourceList">
                </div>
        </div>
    </div>
</div>

<footer>© DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

let allResources = []; // 전체 자료 보관용 배열

auth.onAuthStateChanged(user => {
    const status = document.getElementById("userStatus");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const lockMsg = document.getElementById("lockMessage");
    const mainContent = document.getElementById("mainContent");
    const adminUpload = document.getElementById("adminUpload");

    if (user) {
        db.ref('users/' + user.uid + '/name').on('value', (snapshot) => {
            const name = snapshot.val() || user.email.split('@')[0];
            status.innerText = `${name}님`;
        });
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
        lockMsg.classList.add("hidden");
        mainContent.classList.remove("hidden");

        if(user.email === ADMIN_EMAIL) adminUpload.classList.remove("hidden");
        
        loadResources(user);
    } else {
        status.innerText = "로그인 해주세요";
        loginBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        lockMsg.classList.remove("hidden");
        mainContent.classList.add("hidden");
    }
});

function loadResources(user) {
    db.ref("resources").on("value", snapshot => {
        const data = snapshot.val();
        allResources = []; // 초기화

        if(data) {
            Object.keys(data).forEach(key => {
                allResources.push({ id: key, ...data[key] });
            });
            allResources.reverse();
        }
        renderResources(allResources, user);
    });
}

// 화면에 자료 리스트를 그리는 함수
function renderResources(items, user) {
    const list = document.getElementById("resourceList");
    list.innerHTML = "";
    
    if(items.length === 0) {
        list.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #888; padding: 40px;'>해당하는 자료가 없습니다.</p>";
        return;
    }

    items.forEach(item => {
        const div = document.createElement("div");
        div.className = "resource-item";
        
        const isManager = (user && user.email === ADMIN_EMAIL);
        const delBtn = isManager ? `<button class="btn-delete" onclick="deleteRes('${item.id}')">삭제하기</button>` : "";

        div.innerHTML = `
            <div>
                <div class="file-name">📁 ${item.title}</div>
                <div class="file-desc">${item.desc || '설명 없음'}</div>
            </div>
            <div>
                <a href="${item.link}" target="_blank" class="btn-download">자료 다운로드</a>
                ${delBtn}
            </div>
        `;
        list.appendChild(div);
    });
}

// 🔍 검색 필터링 함수
function filterResources() {
    const keyword = document.getElementById("searchInput").value.toLowerCase();
    const filtered = allResources.filter(item => 
        item.title.toLowerCase().includes(keyword) || 
        item.desc.toLowerCase().includes(keyword)
    );
    renderResources(filtered, auth.currentUser);
}

function uploadResource() {
    const title = document.getElementById("fileTitle").value.trim();
    const desc = document.getElementById("fileDesc").value.trim();
    let link = document.getElementById("fileLink").value.trim();
    if(!title || !link) return alert("필수 항목 입력 누락");
    if(!link.startsWith('http')) link = 'https://' + link;
    db.ref("resources").push({ title, desc, link, createdAt: firebase.database.ServerValue.TIMESTAMP })
    .then(() => {
        alert("등록 완료");
        document.getElementById("fileTitle").value = "";
        document.getElementById("fileDesc").value = "";
        document.getElementById("fileLink").value = "";
    });
}

function deleteRes(key) {
    if(confirm("삭제하시겠습니까?")) db.ref("resources/" + key).remove();
}

function logout() { 
    if(confirm("로그아웃 하시겠습니까?")) auth.signOut().then(() => location.reload());
}
</script>
</body>
</html>
