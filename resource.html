<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>DEEP SKY</title>
    <style>
        /* 1. introduce.html과 동일한 공통 스타일 */
        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: "Segoe UI", AppleSDGothicNeo-Regular, sans-serif; 
            background: #0b0f2b; color: white; line-height: 1.8; 
        }
        .hidden { display: none !important; }

        /* 2. 상단 바 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80;
            height: 60px; position: sticky; top: 0; z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        .logo-area span { font-size: 18px; font-weight: bold; letter-spacing: -0.5px; }

        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button {
            padding: 5px 12px; border-radius: 5px; border: none;
            background: #3a5aff; color: white; cursor: pointer; font-weight: bold;
        }

        /* 3. 헤더 (파란 박스) 및 내비게이션 */
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }

        nav { 
    background: #11153a; 
    border-bottom: 1px solid #2d367a; 
    padding: 10px 0; 
    /* 줄바꿈을 허용하기 위해 아래 두 줄 수정/삭제 */
    overflow-x: visible; 
    white-space: normal; 
}

nav .nav-inner { 
    max-width: 1200px;
    margin: 0 auto; 
    display: flex; 
    /* wrap으로 변경하여 공간이 부족하면 아래로 넘어가게 함 */
    flex-wrap: wrap; 
    justify-content: center; 
    gap: 5px; /* 줄바꿈 시 가독성을 위해 간격을 조금 넓힘 */
}
        nav a { 
            display: inline-block; color: white; padding: 12px 18px; 
            text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 8px;
        }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 4. 본문 컨테이너 */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px 100px; }
        
        .intro-card { 
            background: #161b4a; padding: 35px; border-radius: 20px; 
            border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .intro-card h2 { 
            color: #7fc7ff; border-left: 5px solid #3a5aff; 
            padding-left: 15px; margin-bottom: 25px; font-size: 24px; 
        }

        /* 🔍 검색창 스타일 */
        .search-box {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .search-box input {
            flex: 1; padding: 12px 15px; background: #0b0f2b; 
            border: 1px solid #2d367a; color: white; border-radius: 10px;
            font-size: 14px; outline: none; transition: 0.2s;
        }
        .search-box input:focus { border-color: #3a5aff; box-shadow: 0 0 10px rgba(58, 90, 255, 0.3); }

        /* 관리자용 업로드 박스 */
        .admin-box { 
            background: rgba(58, 90, 255, 0.05); border: 1px dashed #3a5aff; 
            padding: 25px; border-radius: 15px; margin-bottom: 40px; 
        }
        .admin-box h3 { margin-top: 0; color: #7fc7ff; font-size: 18px; margin-bottom: 15px; }
        .admin-box input { 
            width: 100%; padding: 12px; margin-bottom: 10px; background: #0b0f2b; 
            border: 1px solid #1b2f80; color: white; border-radius: 8px; font-size: 14px;
        }
        .btn-main { 
            width: 100%; padding: 13px; background: #3a5aff; color: white; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;
        }
        .btn-main:hover { background: #5a7aff; }

        /* 자료 그리드 */
        .resource-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .resource-item { 
            background: rgba(255,255,255,0.05); padding: 22px; border-radius: 15px; 
            border: 1px solid rgba(58, 90, 255, 0.2); display: flex; flex-direction: column; justify-content: space-between;
            transition: 0.2s;
        }
        .resource-item:hover { transform: translateY(-3px); border-color: #3a5aff; }
        .file-name { font-weight: bold; color: #7fc7ff; font-size: 18px; margin-bottom: 8px; }
        .file-desc { font-size: 14px; color: #ccc; margin-bottom: 20px; min-height: 42px; }
        
        .btn-download { 
            display: block; text-align: center; background: #3a5aff; color: white; 
            text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px;
        }
        .btn-delete { 
            background: none; color: #ff4d4d; border: none; cursor: pointer; 
            font-size: 12px; margin-top: 12px; text-decoration: underline; text-align: center;
        }

        footer { background: #070a1d; text-align: center; padding: 30px 20px; font-size: 12px; color: #888; border-top: 1px solid #1b2f80; margin-top: 50px; }
        
        @media (max-width: 600px) {
            .logo-area span { font-size: 16px; }
            nav a { padding: 10px 12px; font-size: 13px; }
            header h1 { font-size: 22px; }
            .header-logo { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/35'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">확인 중...</span>
        <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<header>
    <h1>자료실</h1>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html">자유 게시판</a>
        <a href="photo.html">활동 사진</a>

        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
        <a href="suggest.html">건의함</a>
        <a href="admin.html">ADMIN</a>
        <a href="block.html">등급 조정 요청</a>
        <a href="https://hq-syrtn.github.io/SYRTN/index.html">SYRTN</a>
    </div>
</nav>

<div class="container">
    <div id="lockMessage" class="intro-card hidden" style="text-align: center;">
        <h2 style="border:none; padding:0; text-align:center;">회원 전용 공간</h2>
        <p>자료실은 DEEP SKY 회원만 접근할 수 있습니다.</p>
        <button class="btn-main" onclick="location.href='login.html'" style="width: auto; padding: 12px 40px; margin-top: 20px;">로그인하러 가기</button>
    </div>

    <div id="mainContent" class="hidden">
        <div id="adminUpload" class="admin-box hidden">
            <h3>새로운 자료 등록 (관리자)</h3>
            <input type="text" id="fileTitle" placeholder="자료 제목">
            <input type="text" id="fileDesc" placeholder="자료 설명">
            <input type="text" id="fileLink" placeholder="다운로드/보기 (외부 링크)">
            <input type="file" id="fileData" style="width: 100%; padding: 12px; margin-bottom: 10px; background: #0b0f2b; color: white; border: 1px solid #1b2f80; border-radius: 8px;">
            <button class="btn-main" onclick="uploadResource()">자료 게시하기</button>
        </div>

        <div class="intro-card">
            <h2>보관된 자료 목록</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="찾으시는 자료의 제목이나 설명을 입력하세요..." onkeyup="filterResources()">
            </div>

            <div class="resource-grid" id="resourceList">
                </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const API_BASE_URL = "https://hypocrite-depletion-until.ngrok-free.dev";
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

let currentUser = null;
let currentUserName = "익명";
let currentUserRole = "guest";
let allResources = {};

auth.onAuthStateChanged((user) => {
    currentUser = user;
    const status = document.getElementById("userStatus");
    if (user) {
        db.ref('users/' + user.uid).on('value', (snapshot) => {
            const userData = snapshot.val() || {};
            currentUserName = userData.name || user.displayName || user.email.split('@')[0];
            currentUserRole = (user.email === ADMIN_EMAIL) ? 'admin' : (userData.role || 'member');
            if (status) status.innerText = `${currentUserName}님 (${currentUserRole})`;
            
            document.getElementById("lockMessage")?.classList.add("hidden");
            document.getElementById("mainContent")?.classList.remove("hidden");

            if(currentUserRole === 'admin' || currentUserRole === 'student') {
                loadResources();
                document.getElementById("adminUpload")?.classList.toggle("hidden", currentUserRole !== 'admin');
            } else {
                document.getElementById("resourceList").innerHTML = "<p style='text-align:center; grid-column:1/-1;'>자료실 열람 권한이 없습니다 (student 이상).</p>";
                document.getElementById("adminUpload")?.classList.add("hidden");
            }
        });
    } else {
        document.getElementById("mainContent")?.classList.add("hidden");
        document.getElementById("lockMessage")?.classList.remove("hidden");
        if (status) status.innerText = "로그인이 필요합니다";
    }
});

async function loadResources() {
    try {
        const token = await currentUser.getIdToken();
        const res = await fetch(`${API_BASE_URL}/api/resources`, {
            headers: {
                "Authorization": `Bearer ${token}`,
                "ngrok-skip-browser-warning": "69420"
            }
        });
        if (!res.ok) {
            const errorData = await res.json().catch(() => ({}));
            throw new Error(errorData.error || "자료 목록을 불러오지 못했습니다.");
        }
        const data = await res.json();
        allResources = data || {};
        renderResources(allResources);
    } catch (err) {
        console.error("자료 로드 실패:", err);
        const list = document.getElementById("resourceList");
        list.innerHTML = `<p style="text-align:center; color:#ff7777; grid-column:1/-1;">${err.message || "자료 로드 실패"}</p>`;
    }
}

function renderResources(data) {
    const list = document.getElementById("resourceList");
    list.innerHTML = "";

    const keys = Object.keys(data || {}).sort((a, b) => getResourceTime(data[b]) - getResourceTime(data[a]));
    if (keys.length === 0) {
        list.innerHTML = `<p style="text-align:center; color:#aaa; grid-column:1/-1;">등록된 자료가 없습니다.</p>`;
        return;
    }

    keys.forEach(key => {
        const item = data[key] || {};
        const div = document.createElement("div");
        div.className = "resource-item";
        div.innerHTML = `
            <div style="margin-bottom:10px;"><strong>${escapeHtml(item.title || '제목 없음')}</strong> (${escapeHtml(formatResourceDate(item.date))})</div>
            <div style="font-size:14px; color:#ddd;">${escapeHtml(item.content || '')}</div>
            <div class="resource-actions" style="margin-top:10px;"></div>
            <hr style="border-top:1px solid #1b2f80; margin-top:15px;">
        `;

        const actions = div.querySelector(".resource-actions");
        getResourceFiles(item).forEach((path, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = `[첨부파일 ${index + 1}]`;
            button.style.cssText = "color:#7fc7ff;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;";
            button.addEventListener("click", () => openResourceFile(path, getResourceFileName(path, index)));
            if (actions.childNodes.length) actions.appendChild(document.createElement("br"));
            actions.appendChild(button);
        });

        const externalUrl = normalizeLink(item.link);
        if (externalUrl) {
            if (actions.childNodes.length) actions.appendChild(document.createElement("br"));
            const link = document.createElement("a");
            link.href = externalUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "[외부 링크]";
            link.style.color = "#7fc7ff";
            actions.appendChild(link);
        }

        if (currentUserRole === 'admin') {
            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.textContent = "[삭제]";
            deleteButton.style.cssText = "margin-left:10px;color:red;background:none;border:none;cursor:pointer;";
            deleteButton.addEventListener("click", () => deleteResource(key));
            actions.appendChild(deleteButton);
        }

        list.appendChild(div);
    });
}

// 파일과 데이터를 자체 서버로 업로드 (multipart/form-data)
async function uploadResource() {
if (currentUserRole !== 'admin') return alert("관리자만 업로드할 수 있습니다.");

     const title = document.getElementById("fileTitle").value.trim();
     const desc = document.getElementById("fileDesc").value.trim();
     const link = document.getElementById("fileLink").value.trim();
     const fileInput = document.getElementById("fileData"); // 수정된 ID 매칭

     if (!title) return alert("제목을 입력하세요.");

     const formData = new FormData();
     formData.append("title", title);
     formData.append("content", desc);
     formData.append("link", link);
     formData.append("author", currentUserName);
     formData.append("date", new Date().toLocaleDateString('ko-KR'));
     if (fileInput && fileInput.files.length > 0) formData.append("file", fileInput.files[0]);

     try {
         const token = await currentUser.getIdToken();
         const res = await fetch(`${API_BASE_URL}/api/resources`, {
             method: "POST",
             headers: {
                 "Authorization": `Bearer ${token}`,
                 "ngrok-skip-browser-warning": "69420"
             },
             body: formData
         });
         if (!res.ok) {
             const errorData = await res.json().catch(() => ({}));
             throw new Error(errorData.error || "업로드 실패");
         }
         alert("자료 등록 완료");
         document.getElementById("fileTitle").value = "";
         document.getElementById("fileDesc").value = "";
         document.getElementById("fileLink").value = "";
         if(fileInput) fileInput.value = "";
         loadResources();
    } catch (err) { alert(err.message || "업로드 에러"); }
}

async function deleteResource(id) {
    if(!confirm("삭제하시겠습니까?")) return;
    const token = await currentUser.getIdToken();
    const res = await fetch(`${API_BASE_URL}/api/resources/${id}`, {
        method: "DELETE",
        headers: {
            "Authorization": `Bearer ${token}`,
            "ngrok-skip-browser-warning": "69420"
        }
    });
    if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        alert(errorData.error || "삭제 실패");
        return;
    }
    loadResources();
}

function filterResources() {
    const term = document.getElementById("searchInput").value.toLowerCase().trim();
    if (!term) {
        renderResources(allResources);
        return;
    }
    const filtered = {};
    Object.keys(allResources).forEach(key => {
        const item = allResources[key] || {};
        const text = `${item.title || ''} ${item.content || ''} ${item.author || ''}`.toLowerCase();
        if (text.includes(term)) filtered[key] = item;
    });
    renderResources(filtered);
}

function getResourceFiles(item) {
    const files = [];
    if (Array.isArray(item.file_paths)) files.push(...item.file_paths);
    if (item.file_path) files.push(item.file_path);
    return files.filter(Boolean);
}

function getResourceFileName(path, index) {
    const raw = String(path || "").split("/").pop() || `file-${index + 1}`;
    return raw.replace(/^res_[^_]+_/, "");
}

function normalizeLink(link) {
    const value = String(link || "").trim();
    if (!value) return "";
    return /^https?:\/\//i.test(value) ? value : `https://${value}`;
}

async function openResourceFile(path, filename) {
    try {
        if (!String(path || "").startsWith("/uploads/resources/")) {
            throw new Error("허용되지 않는 파일 경로입니다.");
        }
        const token = await currentUser.getIdToken();
        const url = `${API_BASE_URL}/api/download?path=${encodeURIComponent(path)}`;
        const res = await fetch(url, {
            headers: {
                "Authorization": `Bearer ${token}`,
                "ngrok-skip-browser-warning": "69420"
            }
        });
        if (!res.ok) throw new Error("파일을 불러오지 못했습니다.");
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        const opened = window.open(objectUrl, "_blank", "noopener,noreferrer");
        if (!opened) {
            const a = document.createElement("a");
            a.href = objectUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
        setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
    } catch (err) {
        alert(err.message || "파일 열기 실패");
    }
}

function getResourceTime(item) {
    const value = item?.createdAt || item?.date || item?.timestamp;
    if (!value) return 0;
    if (typeof value === "number") return value;
    const parsed = Date.parse(value);
    return Number.isNaN(parsed) ? 0 : parsed;
}

function formatResourceDate(value) {
    if (!value) return "";
    const parsed = Date.parse(value);
    if (!Number.isNaN(parsed)) return new Date(parsed).toLocaleDateString("ko-KR");
    return value;
}

function escapeHtml(value) {
    return String(value || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

function escapeAttr(value) {
    return escapeHtml(value).replaceAll("`", "&#096;");
}

function logout() { if(confirm("로그아웃 하시겠습니까?")) auth.signOut().then(() => location.reload()); }
</script>
