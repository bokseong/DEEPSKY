<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료실 - DEEP SKY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Pretendard", sans-serif; background: #0b0f2b; color: white; }
        .hidden { display: none !important; }

        /* 상단 바 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: #070a1d; border-bottom: 1px solid #1b2f80; height: 65px; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; font-weight: bold; }
        .logo-area img { width: 40px; height: 40px; margin-right: 12px; border-radius: 50%; }

        .container { max-width: 1000px; margin: 35px auto; padding: 0 20px 100px; }
        
        /* 업로드 박스 (부장 전용) */
        .upload-card { background: #161b4a; padding: 25px; border-radius: 15px; border: 1px solid #3a5aff; margin-bottom: 30px; }
        .upload-card input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0b0f2b; border: 1px solid #1b2f80; color: white; border-radius: 5px; }

        /* 자료 목록 */
        .resource-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .resource-item { background: #1c235a; padding: 20px; border-radius: 12px; border: 1px solid #2d367a; transition: 0.2s; position: relative; }
        .resource-item:hover { border-color: #3a5aff; transform: translateY(-3px); }
        .file-title { font-weight: bold; color: #7fc7ff; font-size: 18px; margin-bottom: 8px; }
        .file-info { font-size: 13px; color: #aaa; margin-bottom: 15px; }
        
        .btn { padding: 10px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; font-size: 13px; }
        .btn-download { background: #3a5aff; color: white; width: 100%; text-align: center; }
        .btn-delete { background: #ff4d4d; color: white; margin-top: 10px; width: 100%; }
        
        /* 비로그인자 차단 메시지 */
        #loginMessage { text-align: center; padding: 100px 20px; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/40'">
        <span>DEEP SKY 자료실</span>
    </a>
    <div id="userStatus" style="font-size:14px;">확인 중...</div>
</div>

<div class="container">
    <div id="loginMessage" class="hidden">
        <h2 style="color: #ff4d4d;">접근 제한</h2>
        <p>자료실은 동아리 회원(로그인 사용자)만 이용 가능합니다.</p>
        <button onclick="location.href='login.html'" style="padding:10px 20px; background:#3a5aff; color:white; border:none; border-radius:5px; cursor:pointer;">로그인하러 가기</button>
    </div>

    <div id="resourceArea" class="hidden">
        <div id="adminUpload" class="upload-card hidden">
            <h3 style="margin-top:0; color:#7fc7ff;">파일 업로드 (관리자용)</h3>
            <input type="text" id="fileTitle" placeholder="자료 제목을 입력하세요">
            <input type="text" id="fileDesc" placeholder="자료 설명을 입력하세요">
            <input type="text" id="fileLink" placeholder="다운로드 링크(Google Drive 등)">
            <button onclick="uploadResource()" style="width:100%; padding:12px; background:#3a5aff; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">자료 등록</button>
        </div>

        <h2 style="border-left: 5px solid #3a5aff; padding-left: 15px; margin-bottom: 25px;">전체 자료 목록</h2>
        <div class="resource-list" id="resourceList">
            </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

auth.onAuthStateChanged(user => {
    const loginMsg = document.getElementById("loginMessage");
    const resArea = document.getElementById("resourceArea");
    const adminUpload = document.getElementById("adminUpload");
    const status = document.getElementById("userStatus");

    if (user) {
        // 로그인 상태
        loginMsg.classList.add("hidden");
        resArea.classList.remove("hidden");
        status.innerText = user.email.split('@')[0] + "님";

        // 🚨 부장님 체크
        if(user.email === ADMIN_EMAIL) {
            adminUpload.classList.remove("hidden");
        }
        loadResources(user);
    } else {
        // 비로그인 상태
        loginMsg.classList.remove("hidden");
        resArea.classList.add("hidden");
        status.innerText = "비로그인";
    }
});

// 자료 목록 불러오기
function loadResources(user) {
    db.ref("resources").on("value", snapshot => {
        const data = snapshot.val();
        const list = document.getElementById("resourceList");
        list.innerHTML = "";

        if(!data) {
            list.innerHTML = "<p style='color:#888;'>등록된 자료가 없습니다.</p>";
            return;
        }

        Object.keys(data).reverse().forEach(key => {
            const item = data[key];
            const div = document.createElement("div");
            div.className = "resource-item";
            
            // 관리자면 삭제 버튼 추가
            const deleteBtn = (user && user.email === ADMIN_EMAIL) 
                ? `<button class="btn btn-delete" onclick="deleteResource('${key}')">자료 삭제</button>` 
                : "";

            div.innerHTML = `
                <div class="file-title">${item.title}</div>
                <div class="file-info">${item.desc}</div>
                <a href="${item.link}" target="_blank" class="btn btn-download">다운로드</a>
                ${deleteBtn}
            `;
            list.appendChild(div);
        });
    });
}

// 부장용 업로드 함수
function uploadResource() {
    const title = document.getElementById("fileTitle").value;
    const desc = document.getElementById("fileDesc").value;
    const link = document.getElementById("fileLink").value;

    if(!title || !link) return alert("제목과 링크를 입력해주세요.");

    db.ref("resources").push({
        title: title,
        desc: desc,
        link: link,
        createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
        alert("자료 등록 완료!");
        document.getElementById("fileTitle").value = "";
        document.getElementById("fileDesc").value = "";
        document.getElementById("fileLink").value = "";
    });
}

// 부장용 삭제 함수
function deleteResource(key) {
    if(confirm("이 자료를 삭제하시겠습니까?")) {
        db.ref("resources/" + key).remove();
    }
}
</script>
</body>
</html>
