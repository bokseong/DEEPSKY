<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>DEEP SKY</title>
    <style>
        /* 1. introduce.html과 동일한 공통 스타일 */
        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: "Segoe UI", AppleSDGothicNeo-Regular, sans-serif; 
            background: #0b0f2b; color: white; line-height: 1.8; 
        }
        .hidden { display: none !important; }

        /* 2. 상단 바 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: #070a1d; border-bottom: 1px solid #1b2f80;
            height: 60px; position: sticky; top: 0; z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-area img { width: 35px; height: 35px; margin-right: 10px; border-radius: 50%; }
        .logo-area span { font-size: 18px; font-weight: bold; letter-spacing: -0.5px; }

        .auth-bar { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .auth-bar button {
            padding: 5px 12px; border-radius: 5px; border: none;
            background: #3a5aff; color: white; cursor: pointer; font-weight: bold;
        }

        /* 3. 헤더 (파란 박스) 및 내비게이션 */
        header { background: linear-gradient(to right, #0d1b52, #1b2f80); padding: 38px 20px; text-align: center; }

        nav { 
            background: #11153a; 
            border-bottom: 1px solid #2d367a; 
            padding: 10px 0; 
            overflow-x: visible; 
            white-space: normal; 
        }

        nav .nav-inner { 
            max-width: 1200px;
            margin: 0 auto; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 5px; 
        }
        nav a { 
            display: inline-block; color: white; padding: 12px 18px; 
            text-decoration: none; font-weight: bold; font-size: 15px; border-radius: 8px;
        }
        nav a:hover { background: rgba(127, 199, 255, 0.1); color: #7fc7ff; }

        /* 4. 본문 컨테이너 */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px 100px; }
        
        .intro-card { 
            background: #161b4a; padding: 35px; border-radius: 20px; 
            border: 1px solid #2d367a; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .intro-card h2 { 
            color: #7fc7ff; border-left: 5px solid #3a5aff; 
            padding-left: 15px; margin-bottom: 25px; font-size: 24px; 
        }

        /* 🔍 검색창 스타일 */
        .search-box {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .search-box input {
            width: 100%; padding: 12px 15px; background: #0b0f2b; 
            border: 1px solid #2d367a; color: white; border-radius: 10px;
            font-size: 14px; outline: none; transition: 0.2s;
        }
        .search-box input:focus { border-color: #3a5aff; box-shadow: 0 0 10px rgba(58, 90, 255, 0.3); }

        /* 관리자용 업로드 박스 */
        .admin-box { 
            background: rgba(58, 90, 255, 0.05); border: 1px dashed #3a5aff; 
            padding: 25px; border-radius: 15px; margin-bottom: 40px; 
        }
        .admin-box h3 { margin-top: 0; color: #7fc7ff; font-size: 18px; margin-bottom: 15px; }
        .admin-box input { 
            width: 100%; padding: 12px; margin-bottom: 10px; background: #0b0f2b; 
            border: 1px solid #1b2f80; color: white; border-radius: 8px; font-size: 14px;
        }
        .btn-main { 
            width: 100%; padding: 13px; background: #3a5aff; color: white; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;
        }
        .btn-main:hover { background: #5a7aff; }

        /* 자료 그리드 */
        .resource-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .resource-item { 
            background: rgba(255,255,255,0.05); padding: 22px; border-radius: 15px; 
            border: 1px solid rgba(58, 90, 255, 0.2); display: flex; flex-direction: column; justify-content: space-between;
            transition: 0.2s;
        }
        .resource-item:hover { transform: translateY(-3px); border-color: #3a5aff; }
        
        .file-name { font-weight: bold; color: #7fc7ff; font-size: 18px; margin-bottom: 8px; }
        .file-desc { font-size: 14px; color: #ccc; margin-bottom: 15px; min-height: 42px; }
        
        /* 💡 분리된 버튼들을 배치하기 위한 컨테이너와 스타일 고정 수치 */
        .action-container { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .file-list-box { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }

        .btn-download { 
            display: inline-block; text-align: center; background: #22379b; color: #7fc7ff; 
            border: 1px solid #3a5aff; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px;
        }
        .btn-download:hover { background: #2d49cc; color: white; }
        
        .btn-link-out {
            display: inline-block; text-align: center; background: #3a5aff; color: white;
            text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px;
        }
        .btn-link-out:hover { background: #5a7aff; }

        .btn-delete { 
            background: none; color: #ff4d4d; border: none; cursor: pointer; 
            font-size: 12px; margin-top: 12px; text-decoration: underline; text-align: left; padding: 0;
        }

        footer { background: #070a1d; text-align: center; padding: 30px 20px; font-size: 12px; color: #888; border-top: 1px solid #1b2f80; margin-top: 50px; }
        
        @media (max-width: 768px) {
            .resource-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .logo-area span { font-size: 16px; }
            nav a { padding: 10px 12px; font-size: 13px; }
            header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logo-area">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/35'">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">확인 중...</span>
        <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<header>
    <h1>자료실</h1>
</header>

<nav>
    <div class="nav-inner">
        <a href="index.html">홈</a>
        <a href="introduce.html">동아리 소개</a>
        <a href="question.html">질문 게시판</a>
        <a href="board.html">자유 게시판</a>
        <a href="photo.html">활동 사진</a>
        <a href="resource.html">자료실</a>
        <a href="weather.html">기상 정보</a>
        <a href="mypage.html">정보 수정</a>
        <a href="suggest.html">건의함</a>
        <a href="manage.html">등급 관리</a>
        <a href="block.html">등급 조정 요청</a>
        <a href="https://hq-syrtn.github.io/SYRTN/index.html">SYRTN</a>
    </div>
</nav>

<div class="container">
    <div id="lockMessage" class="intro-card hidden" style="text-align: center;">
        <h2 style="border:none; padding:0; text-align:center;">회원 전용 공간</h2>
        <p id="lockText">자료실은 DEEP SKY 회원만 접근할 수 있습니다.</p>
        <button class="btn-main" onclick="location.href='login.html'" style="width: auto; padding: 12px 40px; margin-top: 20px;">로그인하러 가기</button>
    </div>

    <div id="mainContent" class="hidden">
        <div id="adminUpload" class="admin-box hidden">
            <h3>새로운 자료 등록 (관리자)</h3>
            <input type="text" id="fileTitle" placeholder="자료 제목">
            <input type="text" id="fileDesc" placeholder="자료 설명">
            <input type="text" id="fileLink" placeholder="참고 외부 링크 주소 (있을 경우에만 입력)">
            <input type="file" id="fileData" multiple>
            <button class="btn-main" onclick="uploadResource()">자료 게시하기</button>
        </div>

        <div class="intro-card">
            <h2>보관된 자료 목록</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="찾으시는 자료의 제목이나 설명을 입력하세요..." onkeyup="filterResources()">
            </div>

            <div class="resource-grid" id="resourceList"></div>
        </div>
    </div>
</div>

<footer>
    © DEEP SKY | Bokseong Astronomy and Aerospace Club | All rights reserved.
    <br>
    Email : leader.deepsky@gmail.com &nbsp;|    &nbsp;Designed by jw-astro09
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyArvtIZ3QkwUcvz0SLu-AnLRifhkOtQ9CY",
    authDomain: "bokseong-deep-sky.firebaseapp.com",
    databaseURL: "https://bokseong-deep-sky-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bokseong-deep-sky",
    storageBucket: "bokseong-deep-sky.firebasestorage.app",
    messagingSenderId: "800777151311",
    appId: "1:800777151311:web:8c901fcf0ded04b1941b3a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const API_BASE_URL = "https://hypocrite-depletion-until.ngrok-free.dev";
const ADMIN_EMAIL = "leader.deepsky@gmail.com";

let currentUser = null;
let currentUserName = "익명";
let currentUserRole = "guest";
let allResources = {};

auth.onAuthStateChanged((user) => {
    currentUser = user;
    const status = document.getElementById("userStatus");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const lockMessage = document.getElementById("lockMessage");
    const mainContent = document.getElementById("mainContent");
    const adminUpload = document.getElementById("adminUpload");

    if (user) {
        if(loginBtn) loginBtn.classList.add("hidden");
        if(logoutBtn) logoutBtn.classList.remove("hidden");

        db.ref('users/' + user.uid).on('value', (snapshot) => {
            const userData = snapshot.val() || {};
            currentUserName = userData.name || user.displayName || user.email.split('@')[0];
            currentUserRole = (user.email === ADMIN_EMAIL) ? 'admin' : (userData.role || 'member');
            
            if (status) status.innerText = `${currentUserName}님 (${currentUserRole})`;
            
            if (currentUserRole === 'admin' || currentUserRole === 'student') {
                lockMessage.classList.add("hidden");
                mainContent.classList.remove("hidden");
                
                if (currentUserRole === 'admin') {
                    adminUpload.classList.remove("hidden");
                } else {
                    adminUpload.classList.add("hidden");
                }
                loadResources();
            } else {
                mainContent.classList.add("hidden");
                document.getElementById("lockText").innerText = "자료실 열람 권한이 없습니다 (student 등급 이상 전용).";
                lockMessage.classList.remove("hidden");
            }
        });
    } else {
        if(loginBtn) loginBtn.classList.remove("hidden");
        if(logoutBtn) logoutBtn.classList.add("hidden");
        if(status) status.innerText = "로그인 필요";
        
        mainContent.classList.add("hidden");
        document.getElementById("lockText").innerText = "자료실은 DEEP SKY 회원만 접근할 수 있습니다.";
        lockMessage.classList.remove("hidden");
    }
});

async function loadResources() {
    try {
        const token = currentUser ? await currentUser.getIdToken(true) : "";
        const res = await fetch(`${API_BASE_URL}/api/resources`, {
            headers: { 
                "Authorization": `Bearer ${token}`,
                "ngrok-skip-browser-warning": "69420" 
            }
        });
        
        if (!res.ok) {
            document.getElementById("resourceList").innerHTML = "<p style='text-align:center; color:#ff4d4d;'>자료를 불러올 권한이 없거나 인증이 만료되었습니다.</p>";
            return;
        }

        allResources = await res.json();
        renderResourceDOM(allResources);
    } catch (err) {
        console.error("자료 로드 실패:", err);
    }
}

// 💡 [수정] 여러 개 파일 목록 버튼과 외부 링크 이동 버튼을 독립적으로 분리 렌더링하도록 돔 구성 변경
function renderResourceDOM(data) {
    const list = document.getElementById("resourceList");
    list.innerHTML = "";
    
    const keys = Object.keys(data).reverse();
    if(keys.length === 0) {
        list.innerHTML = "<p style='grid-column: span 2; text-align:center; color:#aaa; padding: 20px 0;'>등록된 자료가 없습니다.</p>";
        return;
    }

    keys.forEach(key => {
        const item = data[key];
        const div = document.createElement("div");
        div.className = "resource-item";
        
        // 1. 외부 링크 버튼 생성 유무 판별
        let linkBtnHtml = "";
        if (item.link && item.link.trim() !== "") {
            linkBtnHtml = `<a href="${item.link}" class="btn-link-out" target="_blank">🔗 외부 링크 이동</a>`;
        }

        // 2. 다중 파일 다운로드 버튼 목록 자동 동적 구성
        let fileButtonsHtml = "";
        const filePaths = item.file_paths || [];
        
        // 하위 호환성 유지용 처리 (기존 file_path 단수 데이터가 유실되지 않고 보이도록 설정)
        if (item.file_path && filePaths.length === 0) {
            filePaths.push(item.file_path);
        }

        if (filePaths.length > 0) {
            fileButtonsHtml = `<div class="file-list-box">`;
            filePaths.forEach((path, idx) => {
                // 저장된 고유 파일명 규칙에서 UUID를 자르고 원래 순수 업로드 원본 파일명만 파싱
                const parts = path.split('_');
                const cleanName = parts.length > 2 ? parts.slice(2).join('_') : `첨부 파일 ${idx + 1}`;
                const downloadUrl = `${API_BASE_URL}/api/download?path=${encodeURIComponent(path)}`;
                
                fileButtonsHtml += `<a href="${downloadUrl}" class="btn-download" target="_blank">📄 ${cleanName} 다운로드</a>`;
            });
            fileButtonsHtml += `</div>`;
        }

        div.innerHTML = `
            <div>
                <div class="file-name">${item.title}</div>
                <div style="font-size:12px; color:#888; margin-bottom:10px;">작성자: ${item.author || '관리자'} | 등록일: ${item.date || ''}</div>
                <div class="file-desc">${item.content || '설명이 없습니다.'}</div>
            </div>
            <div class="action-container">
                ${fileButtonsHtml}
                ${linkBtnHtml}
                ${(!fileButtonsHtml && !linkBtnHtml) ? `<span style="color:#aaa; font-size:13px; text-align:center;">다운로드 및 링크 없음</span>` : ""}
                ${currentUserRole === 'admin' ? `<button class="btn-delete" onclick="deleteResource('${key}')">[이 자료 완전 삭제]</button>` : ""}
            </div>
        `;
        list.appendChild(div);
    });
}

function filterResources() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    const filtered = {};
    
    Object.keys(allResources).forEach(key => {
        const item = allResources[key];
        const title = (item.title || "").toLowerCase();
        const content = (item.content || "").toLowerCase();
        
        if(title.includes(query) || content.includes(query)) {
            filtered[key] = item;
        }
    });
    renderResourceDOM(filtered);
}

// 💡 [수정] 여러 개 멀티 파일을 FormData 루프를 돌며 일괄 바인딩하도록 업로드 루틴 확장
async function uploadResource() {
    if (currentUserRole !== 'admin') return alert("관리자만 업로드할 수 있습니다.");

    const title = document.getElementById("fileTitle").value.trim();
    const desc = document.getElementById("fileDesc").value.trim();
    const link = document.getElementById("fileLink").value.trim();
    const fileInput = document.getElementById("fileData");

    if (!title) return alert("제목을 입력하세요.");

    const token = currentUser ? await currentUser.getIdToken(true) : "";
    const formData = new FormData();
    formData.append("title", title);
    formData.append("content", desc);
    formData.append("link", link);
    formData.append("author", currentUserName);
    formData.append("date", new Date().toLocaleDateString('ko-KR'));
    
    // 💡 선택된 다중 파일을 동일한 'file' 키값 배열 형태로 바인딩 처리
    if (fileInput && fileInput.files.length > 0) {
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append("file", fileInput.files[i]);
        }
    }

    try {
        const response = await fetch(`${API_BASE_URL}/api/resources`, {
            method: "POST",
            headers: { 
                "Authorization": `Bearer ${token}`,
                "ngrok-skip-browser-warning": "69420" 
            },
            body: formData
        });

        if(response.ok) {
            alert("자료가 다중 파일 격리 저장소에 정상 등록 완료되었습니다.");
            document.getElementById("fileTitle").value = "";
            document.getElementById("fileDesc").value = "";
            document.getElementById("fileLink").value = "";
            if(fileInput) fileInput.value = "";
            loadResources();
        } else {
            const errData = await response.json();
            alert("업로드 실패: " + (errData.error || "알 수 없는 요인"));
        }
    } catch (err) { 
        alert("업로드 통신 에러가 발생했습니다."); 
    }
}

async function deleteResource(id) {
    if(!confirm("해당 자료물과 서버 하드 내에 실존하는 파일들을 일괄 삭제하시겠습니까?")) return;
    try {
        const token = currentUser ? await currentUser.getIdToken(true) : "";
        const response = await fetch(`${API_BASE_URL}/api/resources/${id}`, { 
            method: "DELETE", 
            headers: { 
                "Authorization": `Bearer ${token}`,
                "ngrok-skip-browser-warning": "69420" 
            } 
        });
        
        if(response.ok) {
            alert("삭제되었습니다.");
            loadResources();
        } else {
            alert("삭제에 실패했습니다.");
        }
    } catch (err) {
        alert("통신 에러가 발생했습니다.");
    }
}

function logout() { if(confirm("로그아웃 하시겠습니까?")) auth.signOut().then(() => location.reload()); }
</script>
</body>
