        <img src="logo.png" alt="" aria-hidden="true">
        <span>DEEP SKY</span>
    </a>
    <div class="auth-bar">
        <span id="userStatus">확인 중...</span>
        <button id="loginBtn" onclick="location.href='login.html'">로그인</button>
        <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
    </div>
</div>

<header>
    <h1>자료실</h1>
</header>

<nav aria-label="주요 메뉴">
    <div class="nav-inner">
        <a href="index.html">홈</a>

<div class="container">
    <div id="lockMessage" class="access-gate hidden"></div>

    <div id="mainContent" class="hidden">
        <div id="adminUpload" class="admin-box hidden">
            <h3>새로운 자료 등록 (관리자)</h3>
            <input type="text" id="fileTitle" aria-label="자료 제목" placeholder="자료 제목">
            <input type="text" id="fileDesc" aria-label="자료 설명" placeholder="자료 설명">
            <input type="url" id="fileLink" aria-label="자료 외부 링크" placeholder="다운로드/보기 (외부 링크)">
            <input type="file" id="fileData" multiple aria-label="업로드할 자료 파일" style="width: 100%; padding: 12px; margin-bottom: 10px; background: #0b0f2b; color: white; border: 1px solid #1b2f80; border-radius: 8px;">
            <div class="upload-progress" aria-live="polite">
                <progress id="resourceUploadProgress" max="100" value="0" hidden></progress>
                <span id="resourceUploadLabel"></span>
            </div>
            <button class="btn-main" onclick="uploadResource()">자료 게시하기</button>
        </div>

        <div class="intro-card">
            <h2>보관된 자료 목록</h2>
            
            <div class="search-box">
                <input type="search" id="searchInput" aria-label="자료 검색" placeholder="찾으시는 자료의 제목이나 설명을 입력하세요..." onkeyup="filterResources()">
            </div>

            <div class="resource-grid" id="resourceList">
                </div>
        </div>
    </div>
</div>
