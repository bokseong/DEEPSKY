<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <title>DEEP SKY | 공지사항</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/records.css">
</head>
<body>
<div class="auth-bar">
    <a href="index.html" class="logo-link"><img src="logo.png" alt="DEEP SKY logo" class="nav-logo"><span>DEEP SKY</span></a>
    <div class="auth-user-zone">
        <a href="login.html" id="login-link" class="auth-btn">LOGIN</a>
        <span id="user-name" hidden></span>
        <button id="logout-btn" class="auth-btn" hidden>LOGOUT</button>
    </div>
</div>
<header class="records-hero">
    <h1>공지사항</h1>
    <p>DEEP SKY 운영 공지와 중요 안내</p>
</header>
<nav class="sub-nav-container" aria-label="주요 메뉴">
    <div class="nav-menu">
        <a href="index.html">HOME</a><a href="introduction.html">INTRODUCTION</a><a href="talk.html">TALK</a><a href="resource.html">RESOURCE</a><a href="suggest.html">SUGGESTION</a><a href="mypage.html">MY PAGE</a><a href="admin.html">ADMIN</a>
    </div>
</nav>
<main class="records-main">
    <section id="announcement-board" class="announcement-feed-section records-panel" aria-labelledby="announcement-title">
        <div class="announcement-heading-row">
            <div><p class="records-eyebrow">NOTICE BOARD</p><h2 id="announcement-title" class="section-title">전체 공지</h2></div>
            <button type="button" class="btn announcement-compose-toggle" hidden>공지 작성</button>
        </div>
        <form class="compact-form announcement-inline-form" hidden>
            <h3 class="announcement-inline-title">새 공지</h3>
            <input type="hidden" name="announcement-id">
            <div class="announcement-form-grid">
                <label>제목<input name="announcement-title" maxlength="120" required></label>
                <label>중요도<select name="announcement-importance"><option value="normal">일반</option><option value="important">중요</option></select></label>
            </div>
            <div class="announcement-form-grid announcement-date-grid">
                <label>게시 시작<input type="datetime-local" name="announcement-start"></label>
                <label>게시 종료<input type="datetime-local" name="announcement-expiry"></label>
            </div>
            <label class="announcement-pinned-label"><input type="checkbox" name="announcement-pinned"> 상단 고정</label>
            <label>내용<textarea name="announcement-content" maxlength="5000" rows="7"></textarea></label>
            <p class="form-status announcement-inline-status" role="status"></p>
            <div class="actions"><button type="button" class="btn announcement-inline-cancel">취소</button><button type="submit" class="btn btn-primary">저장</button></div>
        </form>
        <div id="announcement-list" class="announcement-feed"><div class="loading-state">공지사항을 불러오는 중입니다.</div></div>
    </section>
</main>
<footer><p>&copy; 2026 DEEP SKY. All Rights Reserved.</p><p>복성고등학교 천문·항공우주 동아리</p><p>Contact: leader.deepsky@gmail.com</p></footer>
<script type="module" src="js/announcements.js"></script>
<script type="module" src="frontend-access-control.js"></script>
</body>
</html>
